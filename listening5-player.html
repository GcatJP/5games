<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Adventure Island" />
    <meta name="theme-color" content="#ffcc00" />

    <!-- App icon -->
    <link rel="apple-touch-icon" href="home5.png" />

    <link rel="manifest" href="manifest.json" />

    <title>Adventure Island 5 Listening</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --orange-dark: #c45a1a;
        --burgundy: #8b0b4c;
        --gold: #e8a020;
        --yellow: #fae207;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        background-color: #880e4f;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        position: relative;
      }

      h1 {
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        color: var(--yellow);
        -webkit-text-stroke: 0.8px #f4930b;
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        position: relative;
        z-index: 1;
      }

      .grid-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .player {
        display: flex;
        flex-direction: column;
        gap: clamp(14px, 4vh, 36px);
        width: min(90vw, 620px);
      }

      /* Progress bar */
      .seek {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 34px;
        background: transparent;
        cursor: pointer;
        touch-action: none;
      }
      .seek::-webkit-slider-runnable-track {
        height: 18px;
        border-radius: 999px;
        border: 3px solid var(--gold);
        background: linear-gradient(
          to right,
          var(--gold) var(--pct, 0%),
          var(--burgundy) var(--pct, 0%)
        );
      }
      .seek::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 30px;
        height: 30px;
        margin-top: -9px;
        border-radius: 50%;
        background: var(--yellow);
        border: 3px solid #f4930b;
      }
      .seek::-moz-range-track {
        height: 18px;
        border-radius: 999px;
        border: 3px solid var(--gold);
        background: linear-gradient(
          to right,
          var(--gold) var(--pct, 0%),
          var(--burgundy) var(--pct, 0%)
        );
      }
      .seek::-moz-range-thumb {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--yellow);
        border: 3px solid #f4930b;
      }

      .times {
        display: flex;
        justify-content: space-between;
        margin-top: -6px;
        font-weight: bold;
        font-size: clamp(1rem, 4vw, 1.5rem);
        color: var(--yellow);
        text-shadow:
          1px 1px 0 #4a0628,
          -1px -1px 0 #4a0628,
          1px -1px 0 #4a0628,
          -1px 1px 0 #4a0628;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: clamp(8px, 2.5vw, 20px);
      }

      .btn {
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        font-weight: bold;
        color: var(--gold);
        background: var(--burgundy);
        border: 3px solid var(--gold);
        border-radius: clamp(10px, 2vw, 18px);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: clamp(60px, 22vw, 120px);
        font-size: clamp(1.1rem, 5.2vw, 2.6rem);
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-stroke: 0.5px rgba(0, 0, 0, 0.2);
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease,
          background 0.15s ease,
          color 0.15s ease;
      }
      .btn:active {
        transform: translateY(3px) scale(0.98);
        box-shadow: 0 1px 0 var(--orange-dark);
      }

      /* Play button while audio is playing (shows "Pause") */
      .btn.playing {
        background: var(--gold);
        color: var(--burgundy);
        border-color: var(--yellow);
      }

      .status {
        min-height: 1.4em;
        text-align: center;
        font-weight: bold;
        font-size: 1.1rem;
        color: var(--yellow);
        text-shadow: 1px 1px 0 #4a0628;
      }

      .back-btn {
        position: fixed;
        top: max(14px, env(safe-area-inset-top, 14px));
        left: max(14px, env(safe-area-inset-left, 14px));
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 0.3em;
        background: var(--burgundy);
        color: var(--gold);
        border: 3px solid var(--gold);
        border-radius: 999px;
        padding: 0.35em 0.9em;
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        font-weight: bold;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
      }

      /* LANDSCAPE */
      @media screen and (orientation: landscape) {
        body {
          background-image: url("bg_land5.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
        }

        h1 {
          font-size: clamp(2rem, 7vw, 6rem);
          padding: 0.1em 0.5em;
          margin-top: 4vh;
        }

        .grid-wrapper {
          padding: 1vh 2vw 4vh;
        }

        .btn {
          height: clamp(60px, 22vh, 130px);
          font-size: clamp(1.1rem, 4vw, 2.8rem);
        }
      }

      /* LANDSCAPE IPHONE */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        body {
          width: 100vw !important;
          min-width: 100vw !important;
          overflow-x: hidden !important;
        }

        h1 {
          font-size: clamp(1rem, 6vw, 3rem) !important;
          padding: 0.1em 0.5em !important;
          margin-top: 1vh !important;
        }

        .player {
          gap: 10px;
        }

        .btn {
          height: clamp(40px, 22vh, 80px) !important;
          font-size: clamp(1rem, 3.6vw, 2.2rem) !important;
        }
      }

      /* PORTRAIT */
      @media screen and (orientation: portrait) {
        body {
          overflow-y: auto;
          background-image: url("bg_port5.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
        }

        h1 {
          font-size: clamp(1.5rem, 12vw, 4rem);
          padding: 0.3em 0.5em;
          margin-top: calc(env(safe-area-inset-top, 0px) + 56px);
        }

        .grid-wrapper {
          padding: 2vw 5vw 16vw;
        }
      }

      /* PORTRAIT IPHONE */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          font-size: clamp(1.2rem, 10vw, 3.4rem) !important;
          padding: 0.3em 0.5em !important;
          -webkit-text-stroke: 1.5px #f4930b;
          line-height: 1;
        }

        .player {
          width: 92vw;
        }
      }
    </style>
  </head>

  <body>
    <a class="back-btn" href="listening.html">← Back</a>
    <h1 id="title">Listening</h1>

    <div class="grid-wrapper">
      <div class="player">
        <div>
          <input
            class="seek"
            id="seek"
            type="range"
            min="0"
            max="0"
            step="0.1"
            value="0"
            aria-label="Audio position"
          />
          <div class="times">
            <span id="current">0:00</span>
            <span id="total">0:00</span>
          </div>
        </div>

        <div class="controls">
          <button class="btn" id="play" type="button">Play</button>
          <button class="btn" id="reset" type="button">Reset</button>
        </div>

        <div class="status" id="status" aria-live="polite"></div>
      </div>
    </div>

    <audio id="player" preload="metadata"></audio>

    <script>
      const BASE_URL = "https://adventureislandesl.b-cdn.net/Ai5 Listening/";

      // track id (in the address) -> title and file name (without .mp3)
      const TRACKS = {
        "page-25": "Page 25",
        "test-1": "Test 1",
        "test-2": "Test 2",
      };

      const trackId = new URLSearchParams(location.search).get("track");
      if (!Object.prototype.hasOwnProperty.call(TRACKS, trackId)) {
        location.replace("listening5.html");
      }
      const trackName = TRACKS[trackId] || "";

      const player = document.getElementById("player");
      const seek = document.getElementById("seek");
      const playBtn = document.getElementById("play");
      const resetBtn = document.getElementById("reset");
      const currentEl = document.getElementById("current");
      const totalEl = document.getElementById("total");
      const statusEl = document.getElementById("status");
      let isSeeking = false;

      document.getElementById("title").textContent = trackName;
      document.title = `${trackName} – Adventure Island 5`;
      player.src = encodeURI(`${BASE_URL}${trackName}.mp3`);

      function fmt(t) {
        if (!isFinite(t)) return "0:00";
        const m = Math.floor(t / 60);
        const s = Math.floor(t % 60);
        return `${m}:${String(s).padStart(2, "0")}`;
      }

      function updateUI() {
        const dur = player.duration;
        if (isFinite(dur) && dur > 0) {
          seek.max = dur;
          totalEl.textContent = fmt(dur);
        }
        if (!isSeeking) seek.value = player.currentTime;
        currentEl.textContent = fmt(player.currentTime);
        const pct = seek.max > 0 ? (seek.value / seek.max) * 100 : 0;
        seek.style.setProperty("--pct", pct + "%");
      }

      function setPlaying(isPlaying) {
        playBtn.textContent = isPlaying ? "Pause" : "Play";
        playBtn.classList.toggle("playing", isPlaying);
      }

      playBtn.addEventListener("click", () => {
        if (player.paused) {
          statusEl.textContent = "";
          player.play().catch(() => {
            statusEl.textContent = "Could not play the audio.";
          });
        } else {
          player.pause();
        }
      });

      resetBtn.addEventListener("click", () => {
        player.pause();
        player.currentTime = 0;
        updateUI();
      });

      seek.addEventListener("input", () => {
        isSeeking = true;
        currentEl.textContent = fmt(Number(seek.value));
        const pct = seek.max > 0 ? (seek.value / seek.max) * 100 : 0;
        seek.style.setProperty("--pct", pct + "%");
      });
      seek.addEventListener("change", () => {
        player.currentTime = Number(seek.value);
        isSeeking = false;
        updateUI();
      });

      player.addEventListener("loadedmetadata", updateUI);
      player.addEventListener("durationchange", updateUI);
      player.addEventListener("timeupdate", updateUI);
      player.addEventListener("play", () => setPlaying(true));
      player.addEventListener("pause", () => setPlaying(false));
      player.addEventListener("ended", () => {
        setPlaying(false);
        updateUI();
      });
      player.addEventListener("error", () => {
        statusEl.textContent = "Could not load the audio.";
      });
    </script>
  </body>
</html>
