<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Adventure Island" />
    <meta name="theme-color" content="#ffcc00" />

    <!-- App icon -->
    <link rel="apple-touch-icon" href="home5.png" />

    <link rel="manifest" href="manifest.json" />

    <title>Adventure Island 5 Listening</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --orange-dark: #c45a1a;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        background-color: #880e4f;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        position: relative;
      }

      h1 {
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        color: #fae207;
        -webkit-text-stroke: 0.8px #f4930b;
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        position: relative;
        z-index: 1;
      }

      .grid-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .btn {
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        font-weight: bold;
        color: #e8a020;
        background: #8b0b4c;
        border: 3px solid #e8a020;
        border-radius: clamp(10px, 2vw, 18px);
        text-decoration: none;
        text-align: center;
        line-height: 1.05;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-stroke: 0.5px rgba(0, 0, 0, 0.2);
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease;
      }

      .btn:active {
        transform: translateY(3px) scale(0.98);
        box-shadow: 0 1px 0 var(--orange-dark);
      }

      .back-btn {
        position: fixed;
        top: max(14px, env(safe-area-inset-top, 14px));
        left: max(14px, env(safe-area-inset-left, 14px));
        z-index: 60;
        display: flex;
        align-items: center;
        gap: 0.3em;
        background: #8b0b4c;
        color: #e8a020;
        border: 3px solid #e8a020;
        border-radius: 999px;
        padding: 0.35em 0.9em;
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        font-weight: bold;
        font-size: 1rem;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
      }

      /* LANDSCAPE: 3 buttons in a row */
      @media screen and (orientation: landscape) {
        body {
          background-image: url("bg_land5.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
        }

        h1 {
          font-size: clamp(2rem, 6vw, 5rem);
          padding: 0.1em 0.5em;
          margin-top: 4vh;
        }

        .grid-wrapper {
          padding: 1vh 2vw 4vh;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: clamp(10px, 2.5vw, 28px);
          width: min(94vw, 900px);
        }

        .btn {
          font-size: clamp(1.2rem, 5vw, 3.6rem);
          height: clamp(80px, 32vh, 200px);
        }
      }

      /* LANDSCAPE IPHONE */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        body {
          width: 100vw !important;
          min-width: 100vw !important;
          overflow-x: hidden !important;
        }

        h1 {
          font-size: clamp(1rem, 6vw, 3rem) !important;
          padding: 0.1em 0.5em !important;
          margin-top: 1vh !important;
        }

        .grid-wrapper {
          padding: 1vh 4vw 2vh;
        }

        .btn {
          height: clamp(55px, 34vh, 130px) !important;
          font-size: clamp(1rem, 4.5vw, 3rem) !important;
        }
      }

      /* PORTRAIT: buttons stacked */
      @media screen and (orientation: portrait) {
        body {
          overflow-y: auto;
          background-image: url("bg_port5.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
        }

        h1 {
          font-size: clamp(1.5rem, 11vw, 4rem);
          padding: 0.3em 0.5em;
          margin-top: calc(env(safe-area-inset-top, 0px) + 56px);
        }

        .grid-wrapper {
          padding: 2vw 9vw 10vw;
        }

        .grid {
          display: grid;
          grid-template-columns: 1fr;
          gap: clamp(14px, 5vw, 40px);
          width: 100%;
          max-width: 520px;
        }

        .btn {
          font-size: clamp(1.2rem, 10vw, 4rem);
          height: clamp(70px, 26vw, 170px);
        }
      }

      /* PORTRAIT IPHONE */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          font-size: clamp(1rem, 8.5vw, 3.4rem) !important;
          padding: 0.3em 0.5em !important;
          -webkit-text-stroke: 1.5px #f4930b;
          line-height: 1;
        }

        .grid-wrapper {
          padding: 3vh 9vw 4vw !important;
        }

        .grid {
          gap: 22px !important;
        }

        .btn {
          height: clamp(75px, 28vw, 130px) !important;
          font-size: clamp(1.1rem, 10vw, 3.2rem) !important;
        }
      }
    </style>
  </head>

  <body>
    <a class="back-btn" href="listening.html">← Back</a>
    <h1>Adventure Island 5 Listening</h1>

    <div class="grid-wrapper">
      <div class="grid" id="audio-grid">
        <a class="btn" href="listening5-player.html?track=page-25">Page 25</a>
        <a class="btn" href="listening5-player.html?track=test-1">Test 1</a>
        <a class="btn" href="listening5-player.html?track=test-2">Test 2</a>
      </div>
    </div>
  </body>
</html>
