    <style>

      .question-en {

  <body>
    <h1 class="page-title">Unit 8：Bigger Than</h1>
    <a class="back-btn" href="index.html">← Back</a>
    <div id="app"></div>

    <script>
      /* ---------------- content data ---------------- */

      // Quiz 1: build the correct comparative form.
      const COMPARATIVES = [
        {
          base: "big",
          correct: "bigger",
          wrongs: ["biger", "bigest", "more big"],
        },
        {
          base: "hot",
          correct: "hotter",
          wrongs: ["hoter", "more hot", "hottest"],
        },
        {
          base: "thin",
          correct: "thinner",
          wrongs: ["thiner", "more thin", "thinnest"],
        },
        {
          base: "safe",
          correct: "safer",
          wrongs: ["safeer", "more safe", "safest"],
        },
        {
          base: "nice",
          correct: "nicer",
          wrongs: ["niceer", "more nice", "nicest"],
        },
        {
          base: "cute",
          correct: "cuter",
          wrongs: ["cuteer", "more cute", "cutest"],
        },
        {
          base: "easy",
          correct: "easier",
          wrongs: ["easyer", "more easy", "easiest"],
        },
        {
          base: "busy",
          correct: "busier",
          wrongs: ["busyer", "more busy", "busiest"],
        },
        {
          base: "heavy",
          correct: "heavier",
          wrongs: ["heavyer", "more heavy", "heaviest"],
        },
        {
          base: "good",
          correct: "better",
          wrongs: ["gooder", "more good", "goodest"],
        },
        {
          base: "bad",
          correct: "worse",
          wrongs: ["badder", "more bad", "baddest"],
        },
        {
          base: "far",
          correct: "farther",
          wrongs: ["farer", "more far", "farest"],
        },
        {
          base: "long",
          correct: "longer",
          wrongs: ["longger", "more long", "longest"],
        },
        {
          base: "new",
          correct: "newer",
          wrongs: ["newwer", "more new", "newest"],
        },
        {
          base: "quiet",
          correct: "quieter",
          wrongs: ["quiter", "more quiet", "quietest"],
        },
      ];

      // Quiz 2: choose the comparative word that fits the sentence.
      const CONTEXT_SENTENCES = [
        {
          sentence: "A cheetah is ___ than a turtle. (fast)",
          correct: "faster",
        },
        {
          sentence: "An elephant is ___ than a mouse. (big)",
          correct: "bigger",
        },
        { sentence: "Ice is ___ than fire. (cold)", correct: "colder" },
        { sentence: "My grandfather is ___ than me. (old)", correct: "older" },
        {
          sentence: "This test was ___ than the last one. (easy)",
          correct: "easier",
        },
        { sentence: "A whale is ___ than a fish. (heavy)", correct: "heavier" },
        { sentence: "Today is ___ than yesterday. (hot)", correct: "hotter" },
        {
          sentence: "This story is ___ than that one. (scary)",
          correct: "scarier",
        },
      ];
      const CONTEXT_OPTION_POOL = [
        "faster",
        "bigger",
        "colder",
        "older",
        "easier",
        "heavier",
        "hotter",
        "scarier",
        "smaller",
        "cheaper",
        "louder",
        "quieter",
      ];

      // Quiz 3: turn a comparative statement into a question.
      const STATEMENTS = [
        {
          statement: "You are taller than me.",
          question: "Are you taller than me?",
        },
        {
          statement: "Elephants are heavier than mice.",
          question: "Are elephants heavier than mice?",
        },
        {
          statement: "Sami is older than Kevin.",
          question: "Is Sami older than Kevin?",
        },
        {
          statement: "The tiger is faster than the rabbit.",
          question: "Is the tiger faster than the rabbit?",
        },
        {
          statement: "We are busier than them.",
          question: "Are we busier than them?",
        },
        {
          statement: "It is colder today than yesterday.",
          question: "Is it colder today than yesterday?",
        },
        {
          statement: "They are noisier than us.",
          question: "Are they noisier than us?",
        },
      ];

      /* ---------------- helpers ---------------- */
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function sample(arr, n) {
        return shuffle(arr).slice(0, n);
      }

      function speakText(text) {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-US";
        utter.rate = 0.7;
        window.speechSynthesis.speak(utter);
      }

      function speakPattern(el) {
        const lines = [...el.querySelectorAll(".line")].map((line) => {
          const clone = line.cloneNode(true);
          clone.querySelector(".jp-sub")?.remove();
          return clone.textContent.trim();
        });
        speakText(lines.join(". "));
      }

      /* ---- audio ---- */
      let audioCtx = null;
      function getCtx() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
      }
      function playTone(freq, startTime, duration, gainPeak) {
        const ctx = getCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }
      function playCorrectJingle() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
          playTone(f, now + i * 0.09, 0.22, 0.22),
        );
      }
      function playWrongSound() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        playTone(220, now, 0.18, 0.12);
        playTone(196, now + 0.08, 0.18, 0.1);
      }
      function playWinFanfare() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        [523.25, 523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) =>
          playTone(f, now + [0, 0.15, 0.3, 0.45, 0.6, 0.8][i], 0.3, 0.22),
        );
      }

      /* ---------------- build question banks ---------------- */
      function buildFormQuiz() {
        return sample(COMPARATIVES, 8).map((item) => {
          const options = shuffle([item.correct, ...item.wrongs]);
          return {
            type: "form",
            base: item.base,
            correct: item.correct,
            options,
          };
        });
      }

      function buildContextQuiz() {
        return shuffle(CONTEXT_SENTENCES).map((item) => {
          const distractors = sample(
            CONTEXT_OPTION_POOL.filter((w) => w !== item.correct),
            3,
          );
          const options = shuffle([item.correct, ...distractors]);
          return {
            type: "context",
            sentence: item.sentence,
            correct: item.correct,
            options,
          };
        });
      }

      function buildQuestionQuiz() {
        const AUX = ["Am", "Is", "Are"];
        return shuffle(STATEMENTS).map((item) => {
          const starter = item.question.split(" ")[0];
          const rest = item.question.slice(starter.length);
          const wrongs = AUX.filter((a) => a !== starter).map((a) => a + rest);
          const options = shuffle([item.question, ...wrongs]);
          return {
            type: "question",
            statement: item.statement,
            correct: item.question,
            options,
          };
        });
      }

      /* ---------------- state ---------------- */
      let state = {
        screen: "intro",
        quizIndex: 0,
        qIndex: 0,
        score: 0,
        totalScore: 0,
        totalQuestions: 0,
        banks: [],
      };

      const QUIZ_META = [
        {
          key: "form",
          label: "Quiz 1：Make the Comparative",
          build: buildFormQuiz,
        },
        {
          key: "context",
          label: "Quiz 2：Comparative Sentences",
          build: buildContextQuiz,
        },
        {
          key: "question",
          label: "Quiz 3：Make it a Question",
          build: buildQuestionQuiz,
        },
      ];

      function resetAll() {
        state = {
          screen: "intro",
          quizIndex: 0,
          qIndex: 0,
          score: 0,
          totalScore: 0,
          totalQuestions: 0,
          banks: QUIZ_META.map((m) => m.build()),
        };
      }

      /* ---------------- render ---------------- */
      const app = document.getElementById("app");

      function render() {
        if (state.screen === "intro") return renderIntro();
        if (state.screen === "quiz") return renderQuiz();
        if (state.screen === "quizDone") return renderQuizDone();
        if (state.screen === "final") return renderFinal();
      }

      function renderIntro() {
        app.innerHTML = `
                <h2 class="section-title">Bigger Than</h2>
                <p class="jp">
                  形容詞の後ろに「er」を付けると、比べる言い方になります。
                </p>
                <div class="pattern-box">
                  <div class="line">big, → bigger than</div>
                  <div class="line">new, → newer than</div>
                  <div class="line">long, → longer than</div>
                   <div class="line">slow, → slower than</div>
                </div>
                <div class="pattern-box">
                  <div class="line">The dragon is bigger than Sami.</div>
                  <div class="line">My pen is newer than my pencil.</div>
                </div>

                <p class="jp">
                  つづりが 変わることもあります。
                </p>
                <div class="pattern-box">
                  <div class="line">big, → bigger<span class="jp-sub">最後の文字を 重ねます</span></div>
                  <div class="line">nice, → nicer<span class="jp-sub">e を 取ります</span></div>
                  <div class="line">easy, → easier<span class="jp-sub">y を i に 変えます</span></div>
                </div>
                <p class="jp">
                  「good」と「bad」は 特別な形になります。
                </p>
                <div class="pattern-box">
                  <div class="line">good, → better</div>
                  <div class="line">bad, → worse</div>
                </div>

                <p class="jp">
                  質問文にするときは、am・is・are を 一番前に 置きます。
                </p>
                <div class="pattern-box">
                  <div class="line">You are taller than me, → Are you taller than me?</div>
                </div>

                <p class="en">
                  Are you ready？ Let's try these quizzes！
                </p>

                <div class="btn-row">
                  <button class="btn btn-primary" id="startBtn">Start Quiz</button>
                </div>
              `;
        document.getElementById("startBtn").onclick = () => {
          state.screen = "quiz";
          state.quizIndex = 0;
          state.qIndex = 0;
          state.score = 0;
          render();
        };

        document.querySelectorAll(".pattern-box").forEach((patternBox) => {
          patternBox.style.cursor = "pointer";
          patternBox.addEventListener("click", () => speakPattern(patternBox));
        });
      }

      function currentBank() {
        return state.banks[state.quizIndex];
      }

      function renderQuiz() {
        const meta = QUIZ_META[state.quizIndex];
        const bank = currentBank();
        const q = bank[state.qIndex];

        let bodyHtml = "";

        if (q.type === "form") {
          bodyHtml = `
                  <div class="quiz-icon">
                    <div class="quiz-word">${q.base}</div>
                  </div>
                  <p class="question-en">What is the comparative?</p>
                  <div class="options" id="optionsWrap">
                    ${q.options
                      .map(
                        (opt) =>
                          `<button class="opt-btn" data-correct="${opt === q.correct}">${opt}</button>`,
                      )
                      .join("")}
                  </div>
                `;
        } else if (q.type === "context") {
          bodyHtml = `
                  <div class="quiz-icon">
                    <div class="quiz-sentence">${q.sentence}</div>
                  </div>
                  <p class="question-en">Which word fits?</p>
                  <div class="options" id="optionsWrap">
                    ${q.options
                      .map(
                        (opt) =>
                          `<button class="opt-btn" data-correct="${opt === q.correct}">${opt}</button>`,
                      )
                      .join("")}
                  </div>
                `;
        } else if (q.type === "question") {
          bodyHtml = `
                  <div class="quiz-icon">
                    <div class="quiz-sentence">${q.statement}</div>
                  </div>
                  <p class="question-en">Make it a question!</p>
                  <div class="options options-3" id="optionsWrap">
                    ${q.options
                      .map(
                        (opt) =>
                          `<button class="opt-btn" data-correct="${opt === q.correct}">${opt}</button>`,
                      )
                      .join("")}
                  </div>
                `;
        }

        app.innerHTML = `
                <span class="quiz-label">${meta.label}</span>
               <div class="progress">Question ${state.qIndex + 1} / ${bank.length}</div>
                ${bodyHtml}
                <div class="feedback" id="feedback"></div>
              `;

        document.querySelectorAll(".opt-btn").forEach((btn) => {
          btn.addEventListener("click", () => onAnswer(btn), { once: true });
        });
      }

      function goNext() {
        const bank = currentBank();
        if (state.qIndex < bank.length - 1) {
          state.qIndex++;
          render();
        } else {
          state.totalScore += state.score;
          state.totalQuestions += bank.length;
          state.screen = "quizDone";
          render();
        }
      }

      function onAnswer(btn) {
        const allBtns = document.querySelectorAll(".opt-btn");
        const isCorrect = btn.dataset.correct === "true";
        const feedback = document.getElementById("feedback");

        allBtns.forEach((b) => {
          b.disabled = true;
          if (b.dataset.correct === "true") b.classList.add("correct");
        });
        if (!isCorrect) btn.classList.add("wrong");

        if (isCorrect) {
          state.score++;
          playCorrectJingle();
          feedback.textContent = "Correct! Great job!";
          feedback.className = "feedback good";
          setTimeout(goNext, 1100);
        } else {
          playWrongSound();
          feedback.textContent = "Not quite! Tap the green box to continue.";
          feedback.className = "feedback bad";

          // Swap in a clone of the green button so its old click listener is
          // dropped, then make it tappable to move on.
          const oldBtn = document.querySelector(
            '.opt-btn[data-correct="true"]',
          );
          const newBtn = oldBtn.cloneNode(true);
          oldBtn.replaceWith(newBtn);
          newBtn.disabled = false;
          newBtn.addEventListener("click", goNext, { once: true });
        }
      }
      function renderQuizDone() {
        const meta = QUIZ_META[state.quizIndex];
        const bank = currentBank();
        const isLast = state.quizIndex === QUIZ_META.length - 1;

        app.innerHTML = `
                <span class="quiz-label">${meta.label}</span>
                <h2 class="section-title">Well done！</h2>
                <p class="center-text en" style="font-size:1.2rem;">
                  ${state.score} / ${bank.length} Correct
                </p>
                <div class="btn-row">
                  <button class="btn btn-primary" id="nextBtn">
                    ${isLast ? "Results" : "Next Quiz"}
                  </button>
                </div>
              `;

        document.getElementById("nextBtn").onclick = () => {
          if (isLast) {
            state.screen = "final";
          } else {
            state.quizIndex++;
            state.qIndex = 0;
            state.score = 0;
            state.screen = "quiz";
          }
          render();
        };
      }

      function renderFinal() {
        const pct = Math.round((state.totalScore / state.totalQuestions) * 100);
        let emoji = "🌟";
        let msg = "Excellent!";
        if (pct < 50) {
          emoji = "🌱";
          msg = "Great try! Aim for 100%";
        } else if (pct < 80) {
          emoji = "🌿";
          msg = "Good try! Let`s aim for a better score next time";
        }
        playWinFanfare();
        app.innerHTML = `
                <div class="result-emoji">${emoji}</div>
                <div class="result-score">${state.totalScore} / ${state.totalQuestions} Points（${pct}％）</div>
                <p class="result-msg en">${msg}</p>
                <div class="btn-row">
                  <button class="btn btn-primary" id="retryBtn">Try again!</button>
                </div>
              `;

        document.getElementById("retryBtn").onclick = () => {
          resetAll();

          render();
        };
      }

      /* ---------------- init ---------------- */
      resetAll();
      render();
    </script>
    <script src="tilde-fix.js"></script>
  </body>
</html>
