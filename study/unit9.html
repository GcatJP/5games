  <body>
    <h1 class="page-title">Unit 9：More Difficult Than</h1>
    <a class="back-btn" href="index.html">← Back</a>
    <div id="app"></div>

    <script>
      /* ---------------- content data ---------------- */

      // Quiz 1: build the correct comparative form (more + adjective).
      const LONG_ADJECTIVES = [
        {
          base: "expensive",
          correct: "more expensive",
          wrongs: ["expensiver", "most expensive", "expensivest"],
        },
        {
          base: "beautiful",
          correct: "more beautiful",
          wrongs: ["beautifuler", "most beautiful", "beautifulest"],
        },
        {
          base: "interesting",
          correct: "more interesting",
          wrongs: ["interestinger", "most interesting", "interestingest"],
        },
        {
          base: "boring",
          correct: "more boring",
          wrongs: ["boringer", "most boring", "boringest"],
        },
        {
          base: "difficult",
          correct: "more difficult",
          wrongs: ["difficulter", "most difficult", "difficultest"],
        },
        {
          base: "delicious",
          correct: "more delicious",
          wrongs: ["deliciouser", "most delicious", "deliciousest"],
        },
        {
          base: "dangerous",
          correct: "more dangerous",
          wrongs: ["dangerouser", "most dangerous", "dangerousest"],
        },
        {
          base: "careful",
          correct: "more careful",
          wrongs: ["carefuler", "most careful", "carefulest"],
        },
        {
          base: "famous",
          correct: "more famous",
          wrongs: ["famouser", "most famous", "famousest"],
        },
        {
          base: "popular",
          correct: "more popular",
          wrongs: ["popularer", "most popular", "popularest"],
        },
        {
          base: "important",
          correct: "more important",
          wrongs: ["importanter", "most important", "importantest"],
        },
        {
          base: "useful",
          correct: "more useful",
          wrongs: ["usefuler", "most useful", "usefulest"],
        },
      ];

      // Quiz 2: choose the "more ___" phrase that fits the sentence.
      const CONTEXT_SENTENCES = [
        {
          sentence: "Math is ___ than art. (difficult)",
          correct: "more difficult",
        },
        {
          sentence: "This cake is ___ than that one. (delicious)",
          correct: "more delicious",
        },
        {
          sentence: "A butterfly is ___ than a beetle. (beautiful)",
          correct: "more beautiful",
        },
        {
          sentence: "Skydiving is ___ than walking. (dangerous)",
          correct: "more dangerous",
        },
        {
          sentence: "My teacher is ___ than me. (careful)",
          correct: "more careful",
        },
        {
          sentence: "Baseball is ___ than chess. (popular)",
          correct: "more popular",
        },
        {
          sentence: "This movie is ___ than that book. (interesting)",
          correct: "more interesting",
        },
        {
          sentence: "Sleeping in class is ___ than listening. (boring)",
          correct: "more boring",
        },
      ];
      const CONTEXT_OPTION_POOL = [
        "more difficult",
        "more delicious",
        "more beautiful",
        "more dangerous",
        "more careful",
        "more popular",
        "more interesting",
        "more boring",
        "more famous",
        "more useful",
        "more important",
        "more expensive",
      ];

      // Quiz 3: "as ___ as" — choose the adjective that fits.
      const AS_SENTENCES = [
        { sentence: "Peaches are as ___ as apples.", correct: "sweet" },
        { sentence: "I am as ___ as my friend.", correct: "tall" },
        { sentence: "Kevin is as ___ as Sami.", correct: "clever" },
        { sentence: "Rocks are as ___ as hippos.", correct: "heavy" },
        {
          sentence: "Science is as ___ as social studies.",
          correct: "interesting",
        },
        { sentence: "A pillow is as ___ as a cushion.", correct: "soft" },
        { sentence: "Horses are as ___ as zebras.", correct: "fast" },
        { sentence: "A tablet is as ___ as a computer.", correct: "useful" },
      ];
      const AS_OPTION_POOL = [
        "sweet",
        "tall",
        "clever",
        "heavy",
        "interesting",
        "soft",
        "fast",
        "useful",
        "difficult",
        "famous",
        "dangerous",
        "popular",
      ];

      /* ---------------- helpers ---------------- */
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function sample(arr, n) {
        return shuffle(arr).slice(0, n);
      }

      function speakText(text) {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-US";
        utter.rate = 0.85;
        window.speechSynthesis.speak(utter);
      }

      function speakPattern(el) {
        const lines = [...el.querySelectorAll(".line")].map((line) => {
          const clone = line.cloneNode(true);
          clone.querySelector(".jp-sub")?.remove();
          return clone.textContent.trim();
        });
        speakText(lines.join(". "));
      }

      /* ---- audio ---- */
      let audioCtx = null;
      function getCtx() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
      }
      function playTone(freq, startTime, duration, gainPeak) {
        const ctx = getCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }
      function playCorrectJingle() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
          playTone(f, now + i * 0.09, 0.22, 0.22),
        );
      }
      function playWrongSound() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        playTone(220, now, 0.18, 0.12);
        playTone(196, now + 0.08, 0.18, 0.1);
      }
      function playWinFanfare() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        [523.25, 523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) =>
          playTone(f, now + [0, 0.15, 0.3, 0.45, 0.6, 0.8][i], 0.3, 0.22),
        );
      }

      /* ---------------- build question banks ---------------- */
      function buildFormQuiz() {
        return sample(LONG_ADJECTIVES, 8).map((item) => {
          const options = shuffle([item.correct, ...item.wrongs]);
          return {
            type: "form",
            base: item.base,
            correct: item.correct,
            options,
          };
        });
      }

      function buildContextQuiz() {
        return shuffle(CONTEXT_SENTENCES).map((item) => {
          const distractors = sample(
            CONTEXT_OPTION_POOL.filter((w) => w !== item.correct),
            3,
          );
          const options = shuffle([item.correct, ...distractors]);
          return {
            type: "context",
            sentence: item.sentence,
            correct: item.correct,
            options,
          };
        });
      }

      function buildAsAsQuiz() {
        return shuffle(AS_SENTENCES).map((item) => {
          const distractors = sample(
            AS_OPTION_POOL.filter((w) => w !== item.correct),
            3,
          );
          const options = shuffle([item.correct, ...distractors]);
          return {
            type: "asas",
            sentence: item.sentence,
            correct: item.correct,
            options,
          };
        });
      }

      /* ---------------- state ---------------- */
      let state = {
        screen: "intro",
        quizIndex: 0,
        qIndex: 0,
        score: 0,
        totalScore: 0,
        totalQuestions: 0,
        banks: [],
      };

      const QUIZ_META = [
        { key: "form", label: "Quiz 1：More or -er？", build: buildFormQuiz },
        {
          key: "context",
          label: "Quiz 2：Comparative Sentences",
          build: buildContextQuiz,
        },
        { key: "asas", label: "Quiz 3：As...As", build: buildAsAsQuiz },
      ];

      function resetAll() {
        state = {
          screen: "intro",
          quizIndex: 0,
          qIndex: 0,
          score: 0,
          totalScore: 0,
          totalQuestions: 0,
          banks: QUIZ_META.map((m) => m.build()),
        };
      }

      /* ---------------- render ---------------- */
      const app = document.getElementById("app");

      function render() {
        if (state.screen === "intro") return renderIntro();
        if (state.screen === "quiz") return renderQuiz();
        if (state.screen === "quizDone") return renderQuizDone();
        if (state.screen === "final") return renderFinal();
      }

      function renderIntro() {
        app.innerHTML = `
                <h2 class="section-title">More Difficult Than</h2>
                <p class="jp">
                  長い形容詞は、「er」を 付けずに、「more」を 形容詞の前に置きます。
                </p>
                <div class="pattern-box">
                  <div class="line">more expensive</div>
                  <div class="line">more beautiful</div>
                  <div class="line">more difficult</div>
                  <div class="line">more interesting</div>
                </div>
                <div class="pattern-box">
                  <div class="line">Japanese is more difficult than English.</div>
                  <div class="line">Red pens are more useful than white pens.</div>
                </div>

                <p class="jp">
                  質問文にするときは、is・are を 一番前に置きます。
                </p>
                <div class="pattern-box">
                  <div class="line">Is English more difficult than history?</div>
                  <div class="line">Which is more difficult, English or history?</div>
                </div>

                <h2 class="section-title" style="margin-top:22px;">As...As</h2>
                <p class="jp">
                  「as + 形容詞 + as」は、「～と 同じくらい」という意味です。
                </p>
                <div class="pattern-box">
                  <div class="line">Peaches are as sweet as apples.</div>
                  <div class="line">I am as tall as my friend.</div>
                  <div class="line">Kevin is as clever as Sami.</div>
                </div>

                <p class="en">
                  Are you ready？ Let's try these quizzes！
                </p>

                <div class="btn-row">
                  <button class="btn btn-primary" id="startBtn">Start Quiz</button>
                </div>
              `;
        document.getElementById("startBtn").onclick = () => {
          state.screen = "quiz";
          state.quizIndex = 0;
          state.qIndex = 0;
          state.score = 0;
          render();
        };

        document.querySelectorAll(".pattern-box").forEach((patternBox) => {
          patternBox.style.cursor = "pointer";
          patternBox.addEventListener("click", () => speakPattern(patternBox));
        });
      }

      function currentBank() {
        return state.banks[state.quizIndex];
      }

      function renderQuiz() {
        const meta = QUIZ_META[state.quizIndex];
        const bank = currentBank();
        const q = bank[state.qIndex];

        let bodyHtml = "";

        if (q.type === "form") {
          bodyHtml = `
                  <div class="quiz-icon">
                    <div class="quiz-word">${q.base}</div>
                  </div>
                  <p class="question-en">What is the comparative?</p>
                  <div class="options" id="optionsWrap">
                    ${q.options
                      .map(
                        (opt) =>
                          `<button class="opt-btn" data-correct="${opt === q.correct}">${opt}</button>`,
                      )
                      .join("")}
                  </div>
                `;
        } else if (q.type === "context") {
          bodyHtml = `
                  <div class="quiz-icon">
                    <div class="quiz-sentence">${q.sentence}</div>
                  </div>
                  <p class="question-en">Which phrase fits?</p>
                  <div class="options" id="optionsWrap">
                    ${q.options
                      .map(
                        (opt) =>
                          `<button class="opt-btn" data-correct="${opt === q.correct}">${opt}</button>`,
                      )
                      .join("")}
                  </div>
                `;
        } else if (q.type === "asas") {
          bodyHtml = `
                  <div class="quiz-icon">
                    <div class="quiz-sentence">${q.sentence}</div>
                  </div>
                  <p class="question-en">Which word fits?</p>
                  <div class="options" id="optionsWrap">
                    ${q.options
                      .map(
                        (opt) =>
                          `<button class="opt-btn" data-correct="${opt === q.correct}">${opt}</button>`,
                      )
                      .join("")}
                  </div>
                `;
        }

        app.innerHTML = `
                <span class="quiz-label">${meta.label}</span>
               <div class="progress">Question ${state.qIndex + 1} / ${bank.length}</div>
                ${bodyHtml}
                <div class="feedback" id="feedback"></div>
              `;

        document.querySelectorAll(".opt-btn").forEach((btn) => {
          btn.addEventListener("click", () => onAnswer(btn), { once: true });
        });
      }

      function goNext() {
        const bank = currentBank();
        if (state.qIndex < bank.length - 1) {
          state.qIndex++;
          render();
        } else {
          state.totalScore += state.score;
          state.totalQuestions += bank.length;
          state.screen = "quizDone";
          render();
        }
      }

      function onAnswer(btn) {
        const allBtns = document.querySelectorAll(".opt-btn");
        const isCorrect = btn.dataset.correct === "true";
        const feedback = document.getElementById("feedback");

        allBtns.forEach((b) => {
          b.disabled = true;
          if (b.dataset.correct === "true") b.classList.add("correct");
        });
        if (!isCorrect) btn.classList.add("wrong");

        if (isCorrect) {
          state.score++;
          playCorrectJingle();
          feedback.textContent = "Correct! Great job!";
          feedback.className = "feedback good";
          setTimeout(goNext, 1100);
        } else {
          playWrongSound();
          feedback.textContent = "Not quite! Tap the green box to continue.";
          feedback.className = "feedback bad";

          // Swap in a clone of the green button so its old click listener is
          // dropped, then make it tappable to move on.
          const oldBtn = document.querySelector(
            '.opt-btn[data-correct="true"]',
          );
          const newBtn = oldBtn.cloneNode(true);
          oldBtn.replaceWith(newBtn);
          newBtn.disabled = false;
          newBtn.addEventListener("click", goNext, { once: true });
        }
      }
      function renderQuizDone() {
        const meta = QUIZ_META[state.quizIndex];
        const bank = currentBank();
        const isLast = state.quizIndex === QUIZ_META.length - 1;

        app.innerHTML = `
                <span class="quiz-label">${meta.label}</span>
                <h2 class="section-title">Well done！</h2>
                <p class="center-text en" style="font-size:1.2rem;">
                  ${state.score} / ${bank.length} Correct
                </p>
                <div class="btn-row">
                  <button class="btn btn-primary" id="nextBtn">
                    ${isLast ? "Results" : "Next Quiz"}
                  </button>
                </div>
              `;

        document.getElementById("nextBtn").onclick = () => {
          if (isLast) {
            state.screen = "final";
          } else {
            state.quizIndex++;
            state.qIndex = 0;
            state.score = 0;
            state.screen = "quiz";
          }
          render();
        };
      }

      function renderFinal() {
        const pct = Math.round((state.totalScore / state.totalQuestions) * 100);
        let emoji = "🌟";
        let msg = "Excellent!";
        if (pct < 50) {
          emoji = "🌱";
          msg = "Great try! Aim for 100%";
        } else if (pct < 80) {
          emoji = "🌿";
          msg = "Good try! Let`s aim for a better score next time";
        }
        playWinFanfare();
        app.innerHTML = `
                <div class="result-emoji">${emoji}</div>
                <div class="result-score">${state.totalScore} / ${state.totalQuestions} Points（${pct}％）</div>
                <p class="result-msg en">${msg}</p>
                <div class="btn-row">
                  <button class="btn btn-primary" id="retryBtn">Try again!</button>
                </div>
              `;

        document.getElementById("retryBtn").onclick = () => {
          resetAll();

          render();
        };
      }

      /* ---------------- init ---------------- */
      resetAll();
      render();
    </script>
    <script src="tilde-fix.js"></script>
  </body>
</html>
