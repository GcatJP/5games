  <body>
    <h1 class="page-title">Unit 15：He ate a hamburger.</h1>
    <a class="back-btn" href="index.html">← Back</a>
    <div id="app"></div>

    <script>
      /* ---------------- content data ---------------- */
      const VERBS = [
        { en: "answer ➔ answered", jp: "答えた" },
        { en: "ask ➔ asked", jp: "聞いた" },
        { en: "clean ➔ cleaned", jp: "そうじした" },
        { en: "close ➔ closed", jp: "閉めた" },
        { en: "play ➔ played", jp: "遊んだ" },
        { en: "open ➔ opened", jp: "開けた" },
        { en: "drop ➔ dropped", jp: "落とした" },
        { en: "stop ➔ stopped", jp: "止めた" },
        { en: "try ➔ tried", jp: "試した" },
        { en: "walk ➔ walked", jp: "歩いた" },
        { en: "live ➔ lived", jp: "住んだ" },
        { en: "phone ➔ phoned", jp: "電話した" },
        { en: "eat ➔ ate", jp: "食べた" },
        { en: "go to ➔ went to", jp: "行った" },
        { en: "sit ➔ sat", jp: "すわった" },
        { en: "stand ➔ stood", jp: "立った" },
        { en: "swim ➔ swam", jp: "泳いだ" },
        { en: "take ➔ took", jp: "取った" },
        { en: "write ➔ wrote", jp: "書いた" },
        { en: "have ➔ had", jp: "持った" },
        { en: "buy ➔ bought", jp: "買った" },
        { en: "fall ➔ fell", jp: "落ちた" },
        { en: "think ➔ thought", jp: "思った" },
        { en: "run ➔ ran", jp: "走った" },
      ];

      // Quiz 1: regular verbs → -ed.
      const REGULAR_PAST = [
        {
          base: "clean",
          correct: "cleaned",
          wrongs: ["cleanned", "cleaneed", "cleands"],
        },
        {
          base: "close",
          correct: "closed",
          wrongs: ["closeed", "clossed", "closd"],
        },
        {
          base: "play",
          correct: "played",
          wrongs: ["playeed", "plaied", "playd"],
        },
        {
          base: "open",
          correct: "opened",
          wrongs: ["openned", "openeed", "opend"],
        },
        {
          base: "call",
          correct: "called",
          wrongs: ["callled", "calleed", "calld"],
        },
        { base: "cry", correct: "cried", wrongs: ["cryed", "cries", "criedd"] },
        {
          base: "drop",
          correct: "dropped",
          wrongs: ["droped", "dropeed", "dropd"],
        },
        {
          base: "stop",
          correct: "stopped",
          wrongs: ["stoped", "stopeed", "stopd"],
        },
        { base: "try", correct: "tried", wrongs: ["tryed", "tries", "triedd"] },
        {
          base: "walk",
          correct: "walked",
          wrongs: ["walkked", "walkeed", "walkd"],
        },
        {
          base: "watch",
          correct: "watched",
          wrongs: ["watchhed", "watcheed", "watchd"],
        },
        {
          base: "live",
          correct: "lived",
          wrongs: ["liveed", "livved", "livd"],
        },
        {
          base: "phone",
          correct: "phoned",
          wrongs: ["phoneed", "phonned", "phond"],
        },
      ];

      // Quiz 2: irregular verbs → past form (distractors are common overregularization mistakes).
      const IRREGULAR_PAST = [
        { base: "eat", correct: "ate", wrongs: ["eated", "eat", "ated"] },
        {
          base: "go to",
          correct: "went to",
          wrongs: ["goed to", "go toed", "wented to"],
        },
        { base: "sit", correct: "sat", wrongs: ["sitted", "sited", "sitedd"] },
        {
          base: "stand",
          correct: "stood",
          wrongs: ["standed", "stoud", "standd"],
        },
        {
          base: "swim",
          correct: "swam",
          wrongs: ["swimmed", "swimed", "swum"],
        },
        { base: "take", correct: "took", wrongs: ["taked", "taken", "tooked"] },
        {
          base: "write",
          correct: "wrote",
          wrongs: ["writed", "writted", "wroted"],
        },
        { base: "have", correct: "had", wrongs: ["haved", "haded", "haad"] },
        {
          base: "buy",
          correct: "bought",
          wrongs: ["buyed", "buied", "boughted"],
        },
        {
          base: "fall",
          correct: "fell",
          wrongs: ["falled", "fallen", "felled"],
        },
        {
          base: "think",
          correct: "thought",
          wrongs: ["thinked", "thoughted", "thinkt"],
        },
        { base: "run", correct: "ran", wrongs: ["runned", "ranned", "rund"] },
        {
          base: "catch",
          correct: "caught",
          wrongs: ["catched", "caughted", "catchd"],
        },
        { base: "see", correct: "saw", wrongs: ["seed", "sawed", "seen"] },
        { base: "give", correct: "gave", wrongs: ["gived", "gaved", "given"] },
        { base: "make", correct: "made", wrongs: ["maked", "madee", "maded"] },
      ];

      // Quiz 3: past tense in context (mix of regular and irregular).
      const CONTEXT_SENTENCES = [
        {
          sentence: "Last week, we ___ to the park. (walk)",
          correct: "walked",
        },
        { sentence: "This morning, I ___ breakfast. (eat)", correct: "ate" },
        { sentence: "Yesterday, he ___ a picture. (draw)", correct: "drew" },
        {
          sentence: "Last year, they ___ to Kyoto. (go to)",
          correct: "went to",
        },
        {
          sentence: "Two days ago, I ___ my room. (clean)",
          correct: "cleaned",
        },
        {
          sentence: "Last summer, she ___ in the ocean. (swim)",
          correct: "swam",
        },
        { sentence: "Yesterday, I ___ a letter. (write)", correct: "wrote" },
        { sentence: "Last night, we ___ a movie. (watch)", correct: "watched" },
      ];
      const CONTEXT_OPTION_POOL = [
        "walked",
        "ate",
        "drew",
        "went to",
        "cleaned",
        "swam",
        "wrote",
        "watched",
        "played",
        "ran",
        "took",
        "closed",
      ];

      /* ---------------- helpers ---------------- */
      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function sample(arr, n) {
        return shuffle(arr).slice(0, n);
      }

      function speakText(text) {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-US";
        utter.rate = 0.7;
        window.speechSynthesis.speak(utter);
      }

      function speakPattern(el) {
        const lines = [...el.querySelectorAll(".line")].map((line) => {
          const clone = line.cloneNode(true);
          clone.querySelector(".jp-sub")?.remove();
          return clone.textContent.trim();
        });
        speakText(lines.join(". "));
      }

      /* ---- audio ---- */
      let audioCtx = null;
      function getCtx() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
      }
      function playTone(freq, startTime, duration, gainPeak) {
        const ctx = getCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }
      function playCorrectJingle() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
          playTone(f, now + i * 0.09, 0.22, 0.22),
        );
      }
      function playWrongSound() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        playTone(220, now, 0.18, 0.12);
        playTone(196, now + 0.08, 0.18, 0.1);
      }
      function playWinFanfare() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        [523.25, 523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) =>
          playTone(f, now + [0, 0.15, 0.3, 0.45, 0.6, 0.8][i], 0.3, 0.22),
        );
      }

      /* ---------------- build question banks ---------------- */
      function buildRegularQuiz() {
        return sample(REGULAR_PAST, 8).map((item) => ({
          type: "past",
          base: item.base,
          correct: item.correct,
          options: shuffle([item.correct, ...item.wrongs]),
        }));
      }

      function buildIrregularQuiz() {
        return sample(IRREGULAR_PAST, 8).map((item) => ({
          type: "past",
          base: item.base,
          correct: item.correct,
          options: shuffle([item.correct, ...item.wrongs]),
        }));
      }

      function buildContextQuiz() {
        return shuffle(CONTEXT_SENTENCES).map((item) => {
          const distractors = sample(
            CONTEXT_OPTION_POOL.filter((w) => w !== item.correct),
            3,
          );
          const options = shuffle([item.correct, ...distractors]);
          return {
            type: "context",
            sentence: item.sentence,
            correct: item.correct,
            options,
          };
        });
      }

      /* ---------------- state ---------------- */
      let state = {
        screen: "intro",
        quizIndex: 0,
        qIndex: 0,
        score: 0,
        totalScore: 0,
        totalQuestions: 0,
        banks: [],
      };

      const QUIZ_META = [
        {
          key: "regular",
          label: "Quiz 1：Regular Verbs (-ed)",
          build: buildRegularQuiz,
        },
        {
          key: "irregular",
          label: "Quiz 2：Irregular Verbs",
          build: buildIrregularQuiz,
        },
        {
          key: "context",
          label: "Quiz 3：Past Tense in Context",
          build: buildContextQuiz,
        },
      ];

      function resetAll() {
        state = {
          screen: "intro",
          quizIndex: 0,
          qIndex: 0,
          score: 0,
          totalScore: 0,
          totalQuestions: 0,
          banks: QUIZ_META.map((m) => m.build()),
        };
      }

      /* ---------------- render ---------------- */
      const app = document.getElementById("app");

      function render() {
        if (state.screen === "intro") return renderIntro();
        if (state.screen === "quiz") return renderQuiz();
        if (state.screen === "quizDone") return renderQuizDone();
        if (state.screen === "final") return renderFinal();
      }

      function renderIntro() {
        const cards = VERBS.map(
          (item) => `
               <div class="vocab-card" data-word="${item.en}">
                  <div class="icon-box"><span class="article-tag">💬</span></div>
                  <div class="label">
                    <div class="en-word">${item.en}</div>
                    <div class="jp-word">${item.jp}</div>
                  </div>
                </div>`,
        ).join("");

        app.innerHTML = `
                <h2 class="section-title">Verbs</h2>
                <p class="jp">
                  過去のことを話すときは、動詞を過去形にします。
                </p>
                <div class="vocab-grid">${cards}</div>
                <p class="jp" style="margin-top:-6px;">
                 カードをタップすると、英語の発音が聞こえるよ！ 🔊
              </p>

                <div class="pattern-box">
                  <div class="line">I climbed a mountain last week.</div>
                  <div class="line">They didn't study yesterday.</div>
                  <div class="line">Did you play tennis this morning?</div>
                </div>

                <p class="jp">
                  多くの動詞は「ed」を付けます。つづりが変わることもあります。
                </p>
                <div class="pattern-box">
                  <div class="line">stop, → stopped<span class="jp-sub">最後の 文字を 重ねます</span></div>
                  <div class="line">cry, → cried<span class="jp-sub">y を i に 変えます</span></div>
                  <div class="line">live, → lived<span class="jp-sub">d だけ 付けます</span></div>
                </div>

                <p class="jp">
                  でも、特別な形になる動詞もたくさんあります。
                </p>
                <div class="pattern-box">
                  <div class="line">eat, → ate</div>
                  <div class="line">go to, → went to</div>
                  <div class="line">write, → wrote</div>
                </div>

                <p class="en">
                  Are you ready？ Let's try these quizzes！
                </p>

                <div class="btn-row">
                  <button class="btn btn-primary" id="startBtn">Start Quiz</button>
                </div>
              `;
        document.getElementById("startBtn").onclick = () => {
          state.screen = "quiz";
          state.quizIndex = 0;
          state.qIndex = 0;
          state.score = 0;
          render();
        };
        document.querySelectorAll(".vocab-card").forEach((card) => {
          card.style.cursor = "pointer";
          card.addEventListener("click", () => speakText(card.dataset.word));
        });

        document.querySelectorAll(".pattern-box").forEach((patternBox) => {
          patternBox.style.cursor = "pointer";
          patternBox.addEventListener("click", () => speakPattern(patternBox));
        });
      }

      function currentBank() {
        return state.banks[state.quizIndex];
      }

      function renderQuiz() {
        const meta = QUIZ_META[state.quizIndex];
        const bank = currentBank();
        const q = bank[state.qIndex];

        let bodyHtml = "";

        if (q.type === "past") {
          bodyHtml = `
                  <div class="quiz-icon">
                    <div class="quiz-word">${q.base}</div>
                  </div>
                  <p class="question-en">What is the past tense?</p>
                  <div class="options" id="optionsWrap">
                    ${q.options
                      .map(
                        (opt) =>
                          `<button class="opt-btn" data-correct="${opt === q.correct}">${opt}</button>`,
                      )
                      .join("")}
                  </div>
                `;
        } else if (q.type === "context") {
          bodyHtml = `
                  <div class="quiz-icon">
                    <div class="quiz-sentence">${q.sentence}</div>
                  </div>
                  <p class="question-en">Which word fits?</p>
                  <div class="options" id="optionsWrap">
                    ${q.options
                      .map(
                        (opt) =>
                          `<button class="opt-btn" data-correct="${opt === q.correct}">${opt}</button>`,
                      )
                      .join("")}
                  </div>
                `;
        }

        app.innerHTML = `
                <span class="quiz-label">${meta.label}</span>
               <div class="progress">Question ${state.qIndex + 1} / ${bank.length}</div>
                ${bodyHtml}
                <div class="feedback" id="feedback"></div>
              `;

        document.querySelectorAll(".opt-btn").forEach((btn) => {
          btn.addEventListener("click", () => onAnswer(btn), { once: true });
        });
      }

      function goNext() {
        const bank = currentBank();
        if (state.qIndex < bank.length - 1) {
          state.qIndex++;
          render();
        } else {
          state.totalScore += state.score;
          state.totalQuestions += bank.length;
          state.screen = "quizDone";
          render();
        }
      }

      function onAnswer(btn) {
        const allBtns = document.querySelectorAll(".opt-btn");
        const isCorrect = btn.dataset.correct === "true";
        const feedback = document.getElementById("feedback");

        allBtns.forEach((b) => {
          b.disabled = true;
          if (b.dataset.correct === "true") b.classList.add("correct");
        });
        if (!isCorrect) btn.classList.add("wrong");

        if (isCorrect) {
          state.score++;
          playCorrectJingle();
          feedback.textContent = "Correct! Great job!";
          feedback.className = "feedback good";
          setTimeout(goNext, 1100);
        } else {
          playWrongSound();
          feedback.textContent = "Not quite! Tap the green box to continue.";
          feedback.className = "feedback bad";

          // Swap in a clone of the green button so its old click listener is
          // dropped, then make it tappable to move on.
          const oldBtn = document.querySelector(
            '.opt-btn[data-correct="true"]',
          );
          const newBtn = oldBtn.cloneNode(true);
          oldBtn.replaceWith(newBtn);
          newBtn.disabled = false;
          newBtn.addEventListener("click", goNext, { once: true });
        }
      }

      function renderQuizDone() {
        const meta = QUIZ_META[state.quizIndex];
        const bank = currentBank();
        const isLast = state.quizIndex === QUIZ_META.length - 1;

        app.innerHTML = `
                <span class="quiz-label">${meta.label}</span>
                <h2 class="section-title">Well done！</h2>
                <p class="center-text en" style="font-size:1.2rem;">
                  ${state.score} / ${bank.length} Correct
                </p>
                <div class="btn-row">
                  <button class="btn btn-primary" id="nextBtn">
                    ${isLast ? "Results" : "Next Quiz"}
                  </button>
                </div>
              `;

        document.getElementById("nextBtn").onclick = () => {
          if (isLast) {
            state.screen = "final";
          } else {
            state.quizIndex++;
            state.qIndex = 0;
            state.score = 0;
            state.screen = "quiz";
          }
          render();
        };
      }

      function renderFinal() {
        const pct = Math.round((state.totalScore / state.totalQuestions) * 100);
        let emoji = "🌟";
        let msg = "Excellent!";
        if (pct < 50) {
          emoji = "🌱";
          msg = "Great try! Aim for 100%";
        } else if (pct < 80) {
          emoji = "🌿";
          msg = "Good try! Let`s aim for a better score next time";
        }
        playWinFanfare();
        app.innerHTML = `
                <div class="result-emoji">${emoji}</div>
                <div class="result-score">${state.totalScore} / ${state.totalQuestions} Points（${pct}％）</div>
                <p class="result-msg en">${msg}</p>
                <div class="btn-row">
                  <button class="btn btn-primary" id="retryBtn">Try again!</button>
                </div>
              `;

        document.getElementById("retryBtn").onclick = () => {
          resetAll();

          render();
        };
      }

      /* ---------------- init ---------------- */
      resetAll();
      render();
    </script>
    <script src="tilde-fix.js"></script>
  </body>
</html>
