<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Unit 4. My Diary | Adventure Island 5</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        --font-jp:
          "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        --green-bg: #d81b60;
        --green-panel: #fffdf8;
        --yellow-btn: #d4631e;
        --yellow-btn-active: #c45a1a;
        --heading: #0e6e6e;
        --sun: #ffd23f;
        --ocean: #c4e058;
        --ocean-light: #e8a020;
        --sand: #f6e3b4;
        --correct: #4caf7d;
        --wrong: #e0483c;
        --title-fill: #fae207;
        --title-stroke: #f4930b;
        --chip-bg: #8b0b4c;
        --chip-border: #e8a020;
        --chip-text: #f6c948;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
      }

      body {
        font-family: var(--font-jp);
        background: var(--green-bg);
        background: radial-gradient(ellipse at center top, #d81b60, #880e4f);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 14px 60px;
      }

      h1.page-title {
        font-family: var(--font-chalk);
        color: var(--title-fill);
        -webkit-text-stroke: 1.5px var(--title-stroke);
        text-align: center;
        font-size: clamp(1.4rem, 6vw, 2.4rem);
        letter-spacing: 0.02em;
        margin-bottom: 18px;
      }

      .back-btn {
        position: fixed;
        top: 16px;
        left: 16px;
        font-family: var(--font-chalk);
        font-weight: 700;
        font-size: 0.95rem;
        color: var(--chip-text);
        background: var(--chip-bg);
        border: 3px solid var(--chip-border);
        border-radius: 999px;
        padding: 8px 16px;
        text-decoration: none;
        z-index: 10;
        box-shadow: 0 3px 0 var(--chip-border);
        transition:
          transform 0.08s ease,
          background 0.15s ease;
      }

      .back-btn:active {
        transform: scale(0.96);
        background: var(--chip-border);
      }

      @media (max-width: 480px) {
        .back-btn {
          top: 10px;
          left: 10px;
          padding: 6px 12px;
          font-size: 0.85rem;
        }
      }

      #app {
        width: 100%;
        max-width: 640px;
        background: var(--green-panel);
        border-radius: 22px;
        border: 4px solid var(--ocean);
        box-shadow:
          0 8px 0 var(--heading),
          0 14px 24px rgba(0, 0, 0, 0.25);
        padding: 22px 18px 26px;
      }

      .badge {
        display: inline-block;
        background: var(--heading);
        color: #fff;
        font-family: var(--font-chalk);
        font-size: 0.9rem;
        padding: 4px 14px;
        border-radius: 999px;
        margin-bottom: 10px;
      }

      h2.section-title {
        font-family: var(--font-chalk);
        color: var(--heading);
        font-size: clamp(1.2rem, 5vw, 1.7rem);
        margin-bottom: 14px;
        border-bottom: 3px dashed var(--sun);
        padding-bottom: 8px;
      }

      p.jp {
        font-size: clamp(1rem, 4vw, 1.15rem);
        line-height: 1.9;
        color: #333;
        margin-bottom: 14px;
      }

      .note-box {
        background: #eaf4ff;
        border: 3px dashed var(--ocean-light);
        border-radius: 14px;
        padding: 12px 16px;
        margin-bottom: 18px;
      }

      .note-box .jp {
        margin-bottom: 0;
        font-size: 0.98rem;
      }

      .btn {
        font-family: var(--font-chalk);
        font-weight: 700;
        color: var(--green-panel);
        background: var(--yellow-btn);
        border: 3px solid #333;
        border-radius: 12px;
        cursor: pointer;
        padding: 12px 18px;
        font-size: clamp(1rem, 4.5vw, 1.2rem);
        width: 100%;
        display: block;
        text-align: center;
        transition:
          transform 0.08s ease,
          background 0.15s ease;
      }

      .btn:active {
        transform: scale(0.97);
        background: var(--yellow-btn-active);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .btn-primary {
        max-width: 260px;
        margin: 8px auto 0;
      }

      .btn-secondary {
        background: var(--heading);
      }

      .btn-secondary:active {
        background: #0a5555;
      }

      .btn-row {
        display: flex;
        justify-content: center;
        margin-top: 18px;
      }

      .action-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin: 16px 0 6px;
      }

      @media (max-width: 420px) {
        .action-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .top-link {
        display: inline-block;
        font-family: var(--font-chalk);
        color: var(--heading);
        background: none;
        border: none;
        font-size: 0.95rem;
        cursor: pointer;
        margin-bottom: 12px;
        padding: 0;
      }

      .diary-textarea {
        width: 100%;
        min-height: 340px;
        border: 3px solid #333;
        border-radius: 14px;
        padding: 14px;
        font-family: var(--font-jp);
        font-size: 1rem;
        line-height: 1.7;
        color: #222;
        resize: vertical;
        background: #fff;
      }

      .diary-textarea:focus {
        outline: 3px solid var(--sun);
      }

      .review-box {
        width: 100%;
        min-height: 340px;
        border: 3px solid #333;
        border-radius: 14px;
        padding: 14px;
        font-size: 1rem;
        line-height: 1.9;
        color: #222;
        background: #fff;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }

      mark.err-spell {
        background: rgba(224, 72, 60, 0.15);
        text-decoration: underline wavy var(--wrong);
        text-decoration-thickness: 2px;
        cursor: help;
        border-radius: 3px;
      }

      mark.err-grammar {
        background: rgba(232, 160, 32, 0.18);
        text-decoration: underline wavy var(--ocean-light);
        text-decoration-thickness: 2px;
        cursor: help;
        border-radius: 3px;
      }

      .issue-list {
        list-style: none;
        margin-top: 16px;
        border-top: 3px dashed var(--sun);
        padding-top: 12px;
      }

      .issue-list li {
        font-size: 0.92rem;
        line-height: 1.6;
        color: #333;
        background: #fff8ea;
        border: 2px solid #eee0b8;
        border-radius: 10px;
        padding: 8px 10px;
        margin-bottom: 8px;
      }

      .issue-list li .tag {
        font-family: var(--font-chalk);
        font-weight: 700;
        color: var(--heading);
        margin-right: 6px;
      }

      .status-msg {
        text-align: center;
        font-family: var(--font-chalk);
        color: var(--heading);
        min-height: 1.4em;
        margin-top: 10px;
        font-size: 0.98rem;
      }

      #printArea {
        display: none;
      }

      @media print {
        body * {
          visibility: hidden;
        }
        #printArea,
        #printArea * {
          visibility: visible;
        }
        #printArea {
          display: block !important;
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          padding: 24px;
          white-space: pre-wrap;
          font-family: var(--font-jp);
          font-size: 1rem;
          line-height: 1.8;
          color: #000;
        }
      }
    </style>
  </head>

  <body>
    <h1 class="page-title">Unit 4：My Diary</h1>
    <a class="back-btn" href="index.html">← Back</a>
    <div id="app"></div>
    <script src="review.js"></script>
    <div id="printArea"></div>

    <script>
      /* ---------------- state ---------------- */
      let screen = "advice"; // "advice" | "practice"
      let reviewMode = false; // false = editing, true = showing check results
      let diaryText = "";
      let lastMatches = [];

      const app = document.getElementById("app");
      const printArea = document.getElementById("printArea");

      /* ---------------- helpers ---------------- */
      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function showStatus(msg) {
        const el = document.getElementById("statusMsg");
        if (el) el.textContent = msg;
      }

      function downloadDiary() {
        const blob = new Blob([diaryText], {
          type: "text/plain;charset=utf-8",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "my-diary.txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      async function copyDiary() {
        try {
          await navigator.clipboard.writeText(diaryText);
          showStatus("コピーしました！");
        } catch (e) {
          showStatus("コピーできませんでした。");
        }
      }

      function printDiary() {
        printArea.textContent = diaryText;
        window.print();
      }

      async function checkGrammar(text) {
        const res = await fetch("https://api.languagetool.org/v2/check", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ text: text, language: "en-US" }),
        });
        if (!res.ok) throw new Error("network error");
        const data = await res.json();
        return data.matches || [];
      }

      function isSpelling(match) {
        return (
          match.rule &&
          (match.rule.issueType === "misspelling" ||
            (match.rule.category && match.rule.category.id === "TYPOS"))
        );
      }

      function buildHighlightedHTML(text, matches) {
        const sorted = [...matches].sort((a, b) => a.offset - b.offset);
        let result = "";
        let cursor = 0;
        sorted.forEach((m) => {
          if (m.offset < cursor) return;
          result += escapeHtml(text.slice(cursor, m.offset));
          const errText = text.slice(m.offset, m.offset + m.length);
          const cls = isSpelling(m) ? "err-spell" : "err-grammar";
          const suggestion =
            m.replacements && m.replacements[0] ? m.replacements[0].value : "";
          const tooltip = escapeHtml(
            m.message + (suggestion ? " → " + suggestion : ""),
          );
          result += `<mark class="${cls}" title="${tooltip}">${escapeHtml(errText)}</mark>`;
          cursor = m.offset + m.length;
        });
        result += escapeHtml(text.slice(cursor));
        return result;
      }

      function buildIssueListHTML(matches) {
        if (matches.length === 0) {
          return `<p class="jp" style="margin-top:16px;">まちがいはありませんでした！よくできました！</p>`;
        }
        const items = matches
          .map((m) => {
            const tag = isSpelling(m) ? "スペル" : "文法";
            const suggestion =
              m.replacements && m.replacements[0]
                ? m.replacements[0].value
                : "";
            return `<li><span class="tag">${tag}</span>${escapeHtml(m.message)}${
              suggestion
                ? " → <strong>" + escapeHtml(suggestion) + "</strong>"
                : ""
            }</li>`;
          })
          .join("");
        return `
          <p class="jp" style="margin-top:16px;">${matches.length}個のまちがいが見つかりました。</p>
          <ul class="issue-list">${items}</ul>
        `;
      }

      /* ---------------- render: advice screen ---------------- */
      function renderAdvice() {
        app.innerHTML = `
          <span class="badge">Unit 4：My Diary</span>
          <h2 class="section-title">日記を書く練習をしましょう</h2>
          <p class="jp">
            英語で日記を書く練習をしましょう。
            今日の日付や天気、気持ちを書きます。
          </p>
          <p class="jp">
            だれと会ったか、何をしたかも書きましょう。
            明日したいことも書いてみましょう。
          </p>
          <p class="jp">
            自由に、思ったことを英語で書いてください。
          </p>
          <div class="note-box">
            <p class="jp">
              書き終えて、下の「チェックする」ボタンを押すと、
              スペルや文法のまちがいを教えてくれます。
            </p>
          </div>
          <div class="btn-row">
            <button class="btn btn-primary" id="nextBtn">つぎへ</button>
          </div>
        `;
        document.getElementById("nextBtn").onclick = () => {
          screen = "practice";
          reviewMode = false;
          render();
        };
      }

      /* ---------------- render: practice screen (editing) ---------------- */
      function renderEdit() {
        app.innerHTML = `
          <button class="top-link" id="backLink">← せつめいにもどる</button>
          <span class="badge">Unit 4：My Diary</span>
          <h2 class="section-title">My Diary</h2>
          <textarea class="diary-textarea" id="diaryInput" placeholder="Write your diary in English here...">${escapeHtml(diaryText)}</textarea>
          <div class="action-grid">
            <button class="btn" id="checkBtn">チェックする</button>
            <button class="btn btn-secondary" id="copyBtn">コピーする</button>
            <button class="btn btn-secondary" id="downloadBtn">ダウンロード</button>
            <button class="btn btn-secondary" id="printBtn">いんさつする</button>
          </div>
          <p class="status-msg" id="statusMsg"></p>
        `;

        const textarea = document.getElementById("diaryInput");
        textarea.addEventListener("input", () => {
          diaryText = textarea.value;
        });

        document.getElementById("backLink").onclick = () => {
          diaryText = textarea.value;
          screen = "advice";
          render();
        };

        document.getElementById("copyBtn").onclick = () => {
          diaryText = textarea.value;
          copyDiary();
        };

        document.getElementById("downloadBtn").onclick = () => {
          diaryText = textarea.value;
          downloadDiary();
        };

        document.getElementById("printBtn").onclick = () => {
          diaryText = textarea.value;
          printDiary();
        };

        document.getElementById("checkBtn").onclick = async () => {
          diaryText = textarea.value;
          if (!diaryText.trim()) {
            showStatus("何か書いてから、チェックしてください。");
            return;
          }
          const btn = document.getElementById("checkBtn");
          btn.disabled = true;
          showStatus("チェックしています…");
          try {
            const matches = await checkGrammar(diaryText);
            lastMatches = matches;
            reviewMode = true;
            render();
          } catch (e) {
            btn.disabled = false;
            showStatus(
              "チェックできませんでした。もう一度、ためしてください。",
            );
          }
        };
      }

      /* ---------------- render: practice screen (reviewed) ---------------- */
      function renderReview() {
        const highlighted = buildHighlightedHTML(diaryText, lastMatches);
        const issuesHtml = buildIssueListHTML(lastMatches);

        app.innerHTML = `
          <button class="top-link" id="backLink">← せつめいにもどる</button>
          <span class="badge">Unit 4：My Diary</span>
          <h2 class="section-title">チェックの結果</h2>
          <div class="review-box">${highlighted || "&nbsp;"}</div>
          ${issuesHtml}
          <div class="action-grid" style="margin-top:18px;">
            <button class="btn" id="editAgainBtn">書き直す</button>
            <button class="btn btn-secondary" id="copyBtn">コピーする</button>
            <button class="btn btn-secondary" id="downloadBtn">ダウンロード</button>
            <button class="btn btn-secondary" id="printBtn">いんさつする</button>
          </div>
          <p class="status-msg" id="statusMsg"></p>
        `;

        document.getElementById("backLink").onclick = () => {
          screen = "advice";
          reviewMode = false;
          render();
        };

        document.getElementById("editAgainBtn").onclick = () => {
          reviewMode = false;
          render();
        };

        document.getElementById("copyBtn").onclick = copyDiary;
        document.getElementById("downloadBtn").onclick = downloadDiary;
        document.getElementById("printBtn").onclick = printDiary;
      }

      /* ---------------- render dispatcher ---------------- */
      function render() {
        if (screen === "advice") return renderAdvice();
        if (screen === "practice") {
          return reviewMode ? renderReview() : renderEdit();
        }
      }

      render();
    </script>
    <script src="tilde-fix.js"></script>
  </body>
</html>
