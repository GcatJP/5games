<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Sentence Builder" />
    <meta name="theme-color" content="#ffcc00" />
    <title>Adventure Island — Sentence Builder</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
      }

      :root {
        --ocean-deep: #0e6e6e;
        --coral: #ff7b54;
        --sun: #ffd23f;
        --white: #fffdf8;
        --orange-dark: #c45a1a;
        --orange-btn: #d4631e;
        --card-border: #c4e058;
        --card-bg: #fffdf8;
        --chip-bg: #8b0b4c;
        --chip-border: #e8a020;
        --chip-text: #f6c948;
        --good: #4caf7d;
        --bad: #e0483c;
      }
      .rotate-message {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 100;
        background: radial-gradient(ellipse at center top, #d81b60, #880e4f);
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2em;
      }
      .rotate-message p {
        color: var(--sun);
        -webkit-text-stroke: 0.8px #f4930b;
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        font-weight: bold;
        font-size: clamp(1.2rem, 6vw, 2rem);
        line-height: 1.4;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        max-width: 100vw;
        overflow-x: hidden;
      }

      body {
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        background: radial-gradient(ellipse at center top, #d81b60, #880e4f);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        overflow-x: hidden;
      }
      .back-btn {
        position: fixed;
        top: max(20px, env(safe-area-inset-top, 20px));
        left: clamp(10px, 4vw, 24px);
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        background: var(--chip-bg);
        color: var(--chip-text);
        border: 3px solid var(--chip-border);
        border-radius: 50%;
        font-weight: bold;
        font-size: 1.3rem;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
      }
      /* decorative */

      .cloud {
        position: absolute;
        top: max(20px, env(safe-area-inset-top, 20px));
        right: clamp(8px, 4vw, 36px);
        width: clamp(70px, 14vw, 130px);
        height: auto;
        pointer-events: none;
        user-select: none;
        z-index: 0;
      }

      .wrap {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 720px;
        padding: max(14px, env(safe-area-inset-top, 14px)) 16px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: 1;
      }

      h1 {
        color: #fae207;
        -webkit-text-stroke: 0.8px #f4930b;
        text-align: center;
        font-size: clamp(1.4rem, 5vw, 2.4rem);
        line-height: 1.15;
        margin-bottom: 4px;
      }

      .subtitle {
        color: #ffe0f0;
        font-size: clamp(0.75rem, 2.6vw, 1rem);
        text-align: center;
        margin-bottom: 14px;
      }

      /* top bar: progress + score */
      .topbar {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }

      .progress-track {
        flex: 1;
        height: 14px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.4);
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--sun), var(--coral));
        border-radius: 999px;
        transition: width 0.35s ease;
      }

      .score-pill {
        flex-shrink: 0;
        background: var(--chip-bg);
        border: 3px solid var(--chip-border);
        color: var(--chip-text);
        border-radius: 999px;
        padding: 4px 14px;
        font-weight: bold;
        font-size: clamp(0.8rem, 2.8vw, 1.05rem);
        white-space: nowrap;
      }
      .mute-btn {
        position: fixed;
        top: max(20px, env(safe-area-inset-top, 20px));
        left: calc(clamp(10px, 4vw, 24px) + 54px);
        z-index: 60;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 3px solid var(--chip-border);
        background: var(--chip-bg);
        color: var(--chip-text);
        font-size: 1.2rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* card */
      .card {
        background: var(--card-bg);
        border: 3px solid var(--card-border);
        border-radius: 22px;
        width: 100%;
        padding: clamp(14px, 4vw, 26px);
        box-shadow: 0 10px 0 rgba(0, 0, 0, 0.12);
        position: relative;
      }

      .q-badge {
        position: absolute;
        top: -18px;
        left: 18px;
        background: #d81b60;
        color: var(--sun);
        border: 3px solid var(--sun);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.15rem;
        font-weight: bold;
      }

      .instructions {
        text-align: center;
        color: var(--ocean-deep);
        font-weight: bold;
        font-size: clamp(0.85rem, 3vw, 1.05rem);
        margin: 10px 0 18px;
      }

      /* answer zone */
      .answer-zone {
        display: flex;
        flex-wrap: nowrap;
        gap: 8px;
        align-items: center;
        min-height: 64px;
        overflow-x: auto;
        padding: 10px 12px;
        border: 3px dashed #cfd8dc;
        border-radius: 14px;
        background: #fbfbf4;
        margin-bottom: 18px;
        transition:
          border-color 0.2s,
          background 0.2s;
      }
      .answer-zone.correct {
        border-color: var(--good);
        background: #e9f9f0;
      }
      .answer-zone.wrong {
        border-color: var(--bad);
        background: #fdecea;
        animation: shake 0.4s ease;
      }
      .answer-placeholder {
        color: #b7bfc2;
        font-size: 0.9rem;
        font-style: italic;
        white-space: nowrap;
      }
      @media screen and (orientation: landscape) and (max-height: 450px) {
        .rotate-message {
          display: flex;
        }

        .wrap,
        .back-btn,
        .mute-btn {
          display: none;
        }
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-8px);
        }
        40% {
          transform: translateX(8px);
        }
        60% {
          transform: translateX(-6px);
        }
        80% {
          transform: translateX(6px);
        }
      }

      /* word bank */
      .word-bank {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        min-height: 56px;
        padding: 8px 0;
      }

      .chip {
        touch-action: none;
        background: var(--chip-bg);
        color: var(--chip-text);
        border: 3px solid var(--chip-border);
        border-radius: 12px;
        padding: 8px 14px;
        font-weight: bold;
        font-size: clamp(0.9rem, 3.4vw, 1.15rem);
        cursor: grab;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .chip:active {
        cursor: grabbing;
      }
      .chip.dragging-ghost {
        position: fixed;
        z-index: 50;
        pointer-events: none;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.35);
        transform: scale(1.06) rotate(-2deg);
        opacity: 0.96;
      }

      /* buttons */
      .btn-row {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .action-btn {
        font-family: inherit;
        font-weight: bold;
        font-size: clamp(0.9rem, 3.2vw, 1.1rem);
        border: none;
        border-radius: 14px;
        padding: 12px 22px;
        cursor: pointer;
        color: var(--white);
        transition: transform 0.1s ease;
      }
      .action-btn:active {
        transform: translateY(2px);
      }
      .btn-check {
        background: var(--orange-btn);
        box-shadow: 0 4px 0 var(--orange-dark);
      }
      .btn-reset {
        background: #7b7f8c;
        box-shadow: 0 4px 0 #55575f;
      }
      .btn-next {
        background: var(--good);
        box-shadow: 0 4px 0 #2f7d55;
        display: none;
      }

      .feedback {
        text-align: center;
        font-weight: bold;
        font-size: clamp(0.95rem, 3.4vw, 1.2rem);
        min-height: 1.6em;
        margin-bottom: 8px;
      }
      .feedback.good {
        color: var(--good);
      }
      .feedback.bad {
        color: var(--bad);
      }

      /* end screen */
      .end-screen {
        display: none;
        text-align: center;
      }
      .end-screen h2 {
        color: #fae207;
        -webkit-text-stroke: 0.8px #f4930b;
        font-size: clamp(1.6rem, 6vw, 2.6rem);
        margin-bottom: 10px;
      }
      .end-screen .big-score {
        font-size: clamp(2.2rem, 9vw, 3.6rem);
        color: var(--ocean-deep);
        font-weight: bold;
        margin-bottom: 6px;
      }
      .end-screen p {
        color: var(--ocean-deep);
        margin-bottom: 20px;
        font-size: clamp(0.9rem, 3vw, 1.1rem);
      }

      @media (max-width: 380px) {
        .chip {
          padding: 7px 10px;
        }
      }

      @media (orientation: portrait) {
        .topbar {
          margin-top: clamp(60px, 14vw, 110px);
        }
      }
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          margin-top: 60px;
        }
      }
      @media (max-width: 380px) {
        .chip {
          padding: 7px 10px;
        }
      }

      @media (orientation: portrait) {
        .topbar {
          margin-top: clamp(60px, 14vw, 110px);
        }
      }
    </style>
  </head>

  <body>
    <img class="cloud" src="../p1.png" alt="" />
    <a class="back-btn" href="unit13.html">←</a>
    <div class="rotate-message">
      <p>📱 Please rotate to portrait mode 📱</p>
    </div>
    <div class="wrap">
      <h1>Sentence Builder</h1>
      <div class="subtitle">Drag the words to build the sentence!</div>
      <audio id="bgMusic" src="../game1music.mp3" loop preload="auto"></audio>

      <button id="muteBtn" class="mute-btn">🔊</button>
      <div class="topbar">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="score-pill">⭐ <span id="scoreLabel">0</span> / 12</div>
      </div>

      <!-- GAME CARD -->
      <div class="card" id="gameCard">
        <div class="q-badge" id="qBadge">1</div>
        <div class="instructions">Put the words in the correct order</div>

        <div class="answer-zone" id="answerZone">
          <span class="answer-placeholder" id="answerPlaceholder"
            >Drop words here…</span
          >
        </div>

        <div class="word-bank chip-container" id="wordBank"></div>

        <div class="feedback" id="feedback"></div>

        <div class="btn-row">
          <button class="action-btn btn-reset" id="resetBtn">↺ Reset</button>
          <button class="action-btn btn-check" id="checkBtn">✓ Check</button>
          <button class="action-btn btn-next" id="nextBtn">Next →</button>
        </div>
      </div>

      <!-- END SCREEN -->
      <div class="card end-screen" id="endScreen">
        <h2>Great Job! 🎉</h2>
        <div class="big-score" id="finalScore">0 / 12</div>
        <p id="finalMsg">You finished the Sentence Builder challenge!</p>
        <div class="btn-row">
          <button class="action-btn btn-check" id="playAgainBtn">
            ↺ Play Again
          </button>
        </div>
      </div>
    </div>

    <script>
      const QUESTIONS = [
        "I have a book and a pen.",
        "I can read and write.",
        "I don't like fish or prawns.",
        "Do you like rice or bread?",
        "Puff can't read or write.",
        "I like apples and bananas.",
        "Do you want milk or juice?",
        "He can speak English and Japanese.",
        "I have a cat but I don't have a dog.",
        "I can't swim but I can fly.",
        "I don't have wings but I can fly.",
        "I have wings because I'm a fairy.",
        "I like dragons and dogs.",
        "Do you want tea or coffee?",
        "She is tired but she isn't sleeping.",
        "I'm happy because today is my birthday.",
        "We ate pizza and ice cream.",
        "Is it a cat or a dog?",
        "I studied hard but I still failed.",
        "I'm tired because I didn't sleep well.",
        "I have a pencil and an eraser.",
        "Do you want to walk or run?",
        "It's sunny but it's very cold.",
        "I'm scared because it's dark.",
        "I like reading and writing.",
        "Should we stay or go?",
        "I love cake but I can't eat more.",
        "He is fast but he isn't strong.",
        "I want juice or water.",
        "I'm late because I missed the bus.",
      ].map((s) => s.split(" "));

      const TOTAL_QUESTIONS = 12; // how many are drawn from the pool each game

      // ---------- State ----------
      let order = [];
      let qIndex = 0;
      let score = 0;
      let answeredCorrectly = false;

      const answerZone = document.getElementById("answerZone");
      const wordBank = document.getElementById("wordBank");
      const answerPlaceholder = document.getElementById("answerPlaceholder");
      const feedback = document.getElementById("feedback");
      const qBadge = document.getElementById("qBadge");
      const progressFill = document.getElementById("progressFill");
      const scoreLabel = document.getElementById("scoreLabel");
      const checkBtn = document.getElementById("checkBtn");
      const resetBtn = document.getElementById("resetBtn");
      const nextBtn = document.getElementById("nextBtn");
      const gameCard = document.getElementById("gameCard");
      const endScreen = document.getElementById("endScreen");

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function startGame() {
        order = shuffle([...Array(QUESTIONS.length).keys()]).slice(
          0,
          TOTAL_QUESTIONS,
        );
        qIndex = 0;
        score = 0;
        scoreLabel.textContent = "0";
        endScreen.style.display = "none";
        gameCard.style.display = "block";
        loadQuestion();
      }

      function currentWords() {
        return QUESTIONS[order[qIndex]];
      }

      function loadQuestion() {
        answeredCorrectly = false;
        feedback.textContent = "";
        feedback.className = "feedback";
        answerZone.classList.remove("correct", "wrong");
        nextBtn.style.display = "none";
        checkBtn.disabled = false;
        checkBtn.style.opacity = 1;

        qBadge.textContent = qIndex + 1;
        progressFill.style.width = `${(qIndex / order.length) * 100}%`;

        // clear zones
        answerZone.innerHTML = "";
        answerZone.appendChild(answerPlaceholder);
        wordBank.innerHTML = "";

        const words = shuffle(currentWords());
        words.forEach((word, i) => {
          const chip = createChip(word);
          wordBank.appendChild(chip);
        });
        updatePlaceholder();
      }

      function createChip(word) {
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.textContent = word;
        chip.dataset.word = word;
        attachDragHandlers(chip);
        return chip;
      }

      function updatePlaceholder() {
        const hasChips = answerZone.querySelector(".chip") !== null;
        answerPlaceholder.style.display = hasChips ? "none" : "inline";
      }

      // ---------- Pointer-based drag & drop (works for mouse + touch) ----------
      function attachDragHandlers(chip) {
        chip.addEventListener("pointerdown", onPointerDown);
      }

      let dragState = null;

      // ---------- Sound effects (Web Audio API, no files needed) ----------
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioCtx();

      function beep(
        freq,
        duration,
        type = "sine",
        startDelay = 0,
        volume = 0.25,
      ) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.value = volume;
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const startTime = audioCtx.currentTime + startDelay;
        gain.gain.setValueAtTime(volume, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

        osc.start(startTime);
        osc.stop(startTime + duration);
      }

      function playCorrectSound() {
        beep(660, 0.15, "sine", 0, 0.4);
        beep(880, 0.2, "sine", 0.12, 0.4);
      }

      function playIncorrectSound() {
        beep(200, 0.25, "sawtooth", 0, 0.35);
      }
      // ---------- Background music ----------
      const bgMusic = document.getElementById("bgMusic");
      bgMusic.volume = 0.15; // low background volume (0 = silent, 1 = full)

      let musicStarted = false;
      let musicMuted = false;

      function startMusicOnFirstInteraction() {
        if (musicStarted) return;
        musicStarted = true;
        bgMusic.play().catch(() => {
          // Autoplay was blocked; music will start on the next tap instead
          musicStarted = false;
        });
      }
      // Browsers require a user gesture before audio can play — this listens for the first tap/click anywhere
      document.body.addEventListener(
        "pointerdown",
        startMusicOnFirstInteraction,
        { once: true },
      );

      const muteBtn = document.getElementById("muteBtn");
      muteBtn.addEventListener("click", () => {
        musicMuted = !musicMuted;
        bgMusic.muted = musicMuted;
        muteBtn.textContent = musicMuted ? "🔇" : "🔊";
      });

      // Pause music when the app/tab is backgrounded (home button, app switch,
      // minimizing), resume it when it's back in the foreground.
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          bgMusic.pause();
        } else if (musicStarted && !musicMuted) {
          bgMusic.play().catch(() => {});
        }
      });
      function onPointerDown(e) {
        const chip = e.currentTarget;
        e.preventDefault();

        const rect = chip.getBoundingClientRect();
        const originParent = chip.parentElement;
        const originNext = chip.nextSibling;

        // ghost that follows the pointer
        const ghost = chip.cloneNode(true);
        ghost.classList.add("dragging-ghost");
        ghost.style.width = rect.width + "px";
        ghost.style.left = rect.left + "px";
        ghost.style.top = rect.top + "px";
        document.body.appendChild(ghost);

        chip.style.visibility = "hidden";

        dragState = {
          chip,
          ghost,
          originParent,
          originNext,
          startX: e.clientX,
          startY: e.clientY,
          offsetX: e.clientX - rect.left,
          offsetY: e.clientY - rect.top,
          moved: false,
        };

        window.addEventListener("pointermove", onPointerMove);
        window.addEventListener("pointerup", onPointerUp, { once: true });
      }

      function onPointerMove(e) {
        if (!dragState) return;
        const dx = e.clientX - dragState.startX;
        const dy = e.clientY - dragState.startY;
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) dragState.moved = true;

        dragState.ghost.style.left = e.clientX - dragState.offsetX + "px";
        dragState.ghost.style.top = e.clientY - dragState.offsetY + "px";
      }

      function onPointerUp(e) {
        window.removeEventListener("pointermove", onPointerMove);
        if (!dragState) return;
        const { chip, ghost, originParent, originNext, moved } = dragState;

        ghost.remove();
        chip.style.visibility = "visible";

        const inAnswerZone = originParent === answerZone;

        if (!moved) {
          // TAP behaviour: toggle between wordBank <-> answerZone
          if (inAnswerZone) {
            wordBank.appendChild(chip);
          } else {
            answerZone.appendChild(chip);
          }
        } else {
          // DRAG behaviour: find drop target under pointer
          ghost.style.pointerEvents = "none";
          const target = document.elementFromPoint(e.clientX, e.clientY);
          const container = target
            ? target.closest(".chip-container, #answerZone, #wordBank")
            : null;

          if (container === answerZone) {
            const idx = getDropIndex(answerZone, e.clientX);
            insertAtIndex(answerZone, chip, idx);
          } else if (container === wordBank) {
            wordBank.appendChild(chip);
          } else {
            // dropped outside any valid zone: revert
            if (originNext) {
              originParent.insertBefore(chip, originNext);
            } else {
              originParent.appendChild(chip);
            }
          }
        }

        updatePlaceholder();
        dragState = null;
      }

      function getDropIndex(container, clientX) {
        const chips = [...container.querySelectorAll(".chip")];
        for (let i = 0; i < chips.length; i++) {
          const r = chips[i].getBoundingClientRect();
          if (clientX < r.left + r.width / 2) return i;
        }
        return chips.length;
      }

      function insertAtIndex(container, chip, idx) {
        const chips = [...container.querySelectorAll(".chip")];
        if (idx >= chips.length) {
          container.appendChild(chip);
        } else {
          container.insertBefore(chip, chips[idx]);
        }
      }

      // wordBank also needs to register as a drop container
      wordBank.classList.add("chip-container");
      answerZone.classList.add("chip-container");
      answerZone.id = "answerZone";
      wordBank.id = "wordBank";

      // ---------- Check / Reset / Next ----------
      checkBtn.addEventListener("click", () => {
        const placedChips = [...answerZone.querySelectorAll(".chip")];
        const totalWords = currentWords().length;

        if (placedChips.length < totalWords) {
          feedback.textContent = "Not so fast — place all the words first!";
          feedback.className = "feedback bad";
          answerZone.classList.remove("correct");
          answerZone.classList.add("wrong");
          setTimeout(() => answerZone.classList.remove("wrong"), 400);
          return;
        }

        const placedWords = placedChips.map((c) => c.dataset.word);
        const correctWords = currentWords();
        const isCorrect = placedWords.join(" ") === correctWords.join(" ");

        if (isCorrect) {
          answerZone.classList.remove("wrong");
          answerZone.classList.add("correct");
          feedback.textContent = "✅ Correct! Well done!";
          feedback.className = "feedback good";
          playCorrectSound(); // ← add this line
          if (!answeredCorrectly) {
            score++;
            scoreLabel.textContent = score;
          }
          answeredCorrectly = true;
          checkBtn.disabled = true;
          checkBtn.style.opacity = 0.5;
          nextBtn.style.display = "inline-block";
        } else {
          answerZone.classList.remove("correct");
          answerZone.classList.add("wrong");
          feedback.textContent = "❌ Not quite — try rearranging the words.";
          feedback.className = "feedback bad";
          playIncorrectSound(); // ← add this line
          setTimeout(() => answerZone.classList.remove("wrong"), 400);
        }
      });

      resetBtn.addEventListener("click", () => {
        loadQuestion();
      });

      nextBtn.addEventListener("click", () => {
        qIndex++;
        if (qIndex >= order.length) {
          finishGame();
        } else {
          loadQuestion();
        }
      });

      function finishGame() {
        progressFill.style.width = "100%";
        gameCard.style.display = "none";
        endScreen.style.display = "block";
        document.getElementById("finalScore").textContent =
          `${score} / ${order.length}`;
        const pct = Math.round((score / order.length) * 100);
        let msg = "Nice try — keep practicing!";
        if (pct === 100)
          msg = "Perfect score! You're a Sentence Builder master! 🏆";
        else if (pct >= 80)
          msg = "Awesome work! You really know your grammar! 🌟";
        else if (pct >= 50)
          msg = "Good effort! A little more practice and you'll ace it!";
        document.getElementById("finalMsg").textContent = msg;
      }

      document
        .getElementById("playAgainBtn")
        .addEventListener("click", startGame);

      startGame();
    </script>
  </body>
</html>
