    <style>

      :root {

      .header {

      .score-pill {
        flex-shrink: 0;

        color: var(--chip-text);

      .reset-btn {

        font-size: clamp(0.75rem, 2.4vw, 0.95rem);

        cursor: pointer;

      }
      .reset-btn:active {
        transform: translateY(2px);

      }

      /* grid fills remaining space */
      .grid {
        flex: 1;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: clamp(6px, 1.6vw, 14px);

      .card {
        position: relative;
        width: 100%;
        height: 100%;
        perspective: 800px;
        cursor: pointer;
      }
      .card.locked {
        cursor: default;
      }

      .card-inner {
        position: absolute;
        inset: 0;
        transition: transform 0.42s cubic-bezier(0.4, 0.2, 0.2, 1);
        transform-style: preserve-3d;
      }
      .card.flipped .card-inner,
      .card.matched .card-inner {
        transform: rotateY(180deg);
      }

      .face {
        position: absolute;
        inset: 0;
        border-radius: clamp(8px, 2vw, 14px);
        display: flex;
        align-items: center;
        justify-content: center;
        backface-visibility: hidden;
        overflow: hidden;
      }

      .face-back {
        background: repeating-linear-gradient(
          135deg,
          var(--chip-bg) 0px,
          var(--chip-bg) 10px,
          #a30f5f 10px,
          #a30f5f 20px
        );
        border: 3px solid var(--chip-border);
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
        color: var(--chip-text);
        font-weight: bold;
        font-size: clamp(18px, 7vw, 40px);
        -webkit-text-stroke: 0.6px #55082f;
      }

      .face-front {
        background: var(--card-bg);
        border: 3px solid var(--sun);
        transform: rotateY(180deg);
        box-shadow: 0 3px 0 rgba(0, 0, 0, 0.1);
        padding: 8%;

      .face-front .word {
        font-weight: bold;
        font-size: clamp(13px, 5.5vw, 34px);

        font-size: clamp(15px, 6vw, 38px);

      .card.matched .face-front {
        border-color: var(--good);
        background: linear-gradient(135deg, #eafaf1, #d3f3e2);
        animation: glow 1s ease-in-out infinite alternate;
      }
      @keyframes glow {
        from {
          box-shadow:
            0 0 6px 0 rgba(76, 175, 125, 0.5),
            0 3px 0 rgba(0, 0, 0, 0.1);
        }
        to {
          box-shadow:
            0 0 16px 6px rgba(76, 175, 125, 0.75),
            0 3px 0 rgba(0, 0, 0, 0.1);
        }
      }
      .card.wrong .card-inner {
        animation: shake 0.4s;
      }
      @keyframes shake {
        0%,
        100% {
          transform: rotateY(180deg) translateX(0);
        }
        25% {
          transform: rotateY(180deg) translateX(-5px);
        }
        75% {
          transform: rotateY(180deg) translateX(5px);
        }
      }
      .mute-btn {
        display: flex;
        align-items: center;

        width: 44px;

        flex-shrink: 0;
        border-radius: 50%;
        border: 3px solid var(--chip-border);

      .sparkle {

      @keyframes pop {
        0% {

        100% {
          opacity: 0;
          transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(180deg);

      /* win overlay */
      .overlay {
        display: none;
        position: fixed;
        inset: 0;

        align-items: center;
        justify-content: center;

      }
      .overlay.show {
        display: flex;

      .win-card {
        background: var(--card-bg);

      .win-card h2 {
        color: #fae207;

      .win-card p {

      @media screen and (orientation: portrait) and (max-width: 430px) {

          font-size: clamp(1rem, 5.5vw, 1.5rem);
        }
        .score-pill,
        .reset-btn {
          padding: 6px 10px;
        }
      }
    </style>

  <body>

    <div class="overlay" id="overlay">
      <div class="win-card">
        <div class="win-emojis">🏆 Great! 🏆</div>

    <script>
      /* ---- PAIRS — symbols/words and English/Japanese from Unit 1 ---- */
      /* ---- PAIRS — opposite comparative adjectives from Unit 8 ---- */
      const PAIRS = [
        { a: "I", b: "Me" },
        { a: "He", b: "Him" },
        { a: "She", b: "Her" },
        { a: "You", b: "Your" },
        { a: "It", b: "Its" },
        { a: "They", b: "Them" },
        { a: "We", b: "Us" },
        { a: "Puff", b: "Puff's" },
      ];
      /* ---- audio ---- */
      let audioCtx = null;
      function getCtx() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
      }
      function playTone(freq, startTime, duration, gainPeak) {
        const ctx = getCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }
      function playMatchJingle() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
          playTone(f, now + i * 0.09, 0.22, 0.22),
        );
      }
      function playWrongSound() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        playTone(220, now, 0.18, 0.12);
        playTone(196, now + 0.08, 0.18, 0.1);
      }
      function playWinFanfare() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        [523.25, 523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) =>
          playTone(f, now + [0, 0.15, 0.3, 0.45, 0.6, 0.8][i], 0.3, 0.22),
        );
      }
      const bgMusic = document.getElementById("bgMusic");
      bgMusic.volume = 0.15;
      let musicStarted = false;
      let musicMuted = false;

      function startMusicOnFirstInteraction() {
        if (musicStarted) return;
        musicStarted = true;
        bgMusic.play().catch(() => {
          musicStarted = false;
        });
      }
      document.body.addEventListener(
        "pointerdown",
        startMusicOnFirstInteraction,
        {
          once: true,
        },
      );

      const muteBtn = document.getElementById("muteBtn");
      muteBtn.addEventListener("click", () => {
        musicMuted = !musicMuted;
        bgMusic.muted = musicMuted;
        muteBtn.textContent = musicMuted ? "🔇" : "🔊";
      });
      /* ---- game state ---- */
      let deck = [],
        flippedCards = [],
        matches = 0,
        tries = 0,
        locked = false;

      const triesPill = document.getElementById("triesPill");

      function buildDeck() {
        let cards = [];
        PAIRS.forEach((p, idx) => {
          cards.push({ pairId: idx, value: p.a, cls: p.aType || "" });
          cards.push({ pairId: idx, value: p.b, cls: p.bType || "" });
        });
        for (let i = cards.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [cards[i], cards[j]] = [cards[j], cards[i]];
        }
        return cards;
      }

      function render() {
        const grid = document.getElementById("grid");
        grid.innerHTML = "";
        deck.forEach((card, i) => {
          const el = document.createElement("div");
          el.className = "card";
          el.dataset.index = i;

          const inner = document.createElement("div");
          inner.className = "card-inner";

          const back = document.createElement("div");
          back.className = "face face-back";
          back.textContent = "?";

          const front = document.createElement("div");
          front.className = "face face-front";
          const span = document.createElement("div");
          span.className = "word" + (card.cls ? " " + card.cls : "");
          span.textContent = card.value;
          front.appendChild(span);

          inner.appendChild(back);
          inner.appendChild(front);
          el.appendChild(inner);
          el.addEventListener("click", () => onCardClick(el, card));
          grid.appendChild(el);
        });
      }

      function onCardClick(el, card) {
        getCtx();
        if (locked) return;
        if (
          el.classList.contains("flipped") ||
          el.classList.contains("matched")
        )
          return;
        if (flippedCards.length === 2) return;

        el.classList.add("flipped");
        flippedCards.push({ el, card });

        if (flippedCards.length === 2) {
          tries++;
          triesPill.textContent = `Tries: ${tries}`;

          locked = true;
          const [a, b] = flippedCards;
          if (a.card.pairId === b.card.pairId) {
            setTimeout(() => {
              a.el.classList.add("matched");
              b.el.classList.add("matched");
              spawnSparkles(a.el);
              spawnSparkles(b.el);
              playMatchJingle();
              matches++;

              flippedCards = [];
              locked = false;
              if (matches === PAIRS.length) setTimeout(showWin, 600);
            }, 350);
          } else {
            setTimeout(() => {
              a.el.classList.add("wrong");
              b.el.classList.add("wrong");
              playWrongSound();
            }, 250);
            setTimeout(() => {
              a.el.classList.remove("flipped", "wrong");
              b.el.classList.remove("flipped", "wrong");
              flippedCards = [];
              locked = false;
            }, 1000);
          }
        }
      }

      function spawnSparkles(el) {
        const emojis = ["✨", "🌟", "🐚", "⭐"];
        for (let i = 0; i < 5; i++) {
          const s = document.createElement("div");
          s.className = "sparkle";
          s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          const angle = Math.random() * Math.PI * 2;
          const dist = 35 + Math.random() * 25;
          s.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
          s.style.setProperty("--dy", `${Math.sin(angle) * dist}px`);
          s.style.left = "50%";
          s.style.top = "50%";
          el.appendChild(s);
          setTimeout(() => s.remove(), 950);
        }
      }

      function showWin() {
        document.getElementById("winStats").textContent =
          `You matched all ${PAIRS.length} pairs in ${tries} tries!`;
        document.getElementById("overlay").classList.add("show");
        playWinFanfare();
      }

      function newGame() {
        matches = 0;
        tries = 0;
        flippedCards = [];
        locked = false;
        triesPill.textContent = "Tries: 0";

        document.getElementById("overlay").classList.remove("show");
        deck = buildDeck();
        render();
      }

      document.getElementById("resetBtn").addEventListener("click", newGame);
      document
        .getElementById("playAgainBtn")
        .addEventListener("click", newGame);
      newGame();
    </script>
