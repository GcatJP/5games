<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Adventure Island" />
    <meta name="theme-color" content="#ffcc00" />

    <!-- App icons -->
    <link rel="apple-touch-icon" href="../images/home4.png" />

    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com/" />
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap"
      rel="stylesheet"
    />
    <title>Adventure Island 5</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --sun: #ffd23f;
        --white: #fffdf8;
        --orange-dark: #c45a1a;
        --orange-btn: #d4631e;
        --chip-bg: #8b0b4c;
        --chip-border: #e8a020;
        --chip-text: #e8a020;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family:
          "Comic Neue", "Chalkboard SE", "Comic Sans MS", "Segoe Print",
          sans-serif;
        background-color: #880e4f;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        position: relative;
      }
      .back-btn {
        position: fixed;
        top: max(20px, env(safe-area-inset-top, 20px));
        left: clamp(10px, 4vw, 24px);
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        background: var(--chip-bg);
        color: var(--chip-text);
        border: 3px solid var(--chip-border);
        border-radius: 50%;
        font-weight: bold;
        font-size: 1.3rem;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      .back-btn:active {
        transform: translateY(2px);
      }
      .back-btn:active {
        transform: translateY(2px);
      }
      /* decorative */
      .btn-icon {
        height: 78%;
        width: auto;
        max-width: 40%; /* cap how much horizontal space the icon can claim */
        object-fit: contain;
        flex-shrink: 1; /* allow the icon to shrink if space is tight */
        pointer-events: none;
        user-select: none;
      }

      h1 {
        font-family:
          "Comic Neue", "Chalkboard SE", "Comic Sans MS", "Segoe Print",
          sans-serif;
        color: #fae207;
        -webkit-text-stroke: 0.8px #f4930b;
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        white-space: nowrap;
        position: relative;
        z-index: 1;
      }

      .grid-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      .btn {
        font-family:
          "Comic Neue", "Chalkboard SE", "Comic Sans MS", "Segoe Print",
          sans-serif;
        font-weight: bold;
        color: var(--chip-text);
        background: var(--chip-bg);
        border: 3px solid var(--chip-border);
        border-radius: clamp(10px, 2vw, 18px);
        text-decoration: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 0.4em;
        padding: 0 0.6em;
        width: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-stroke: 0.5px rgba(0, 0, 0, 0.2);
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease;
      }

      .btn:active {
        transform: translateY(3px) scale(0.98);
        box-shadow: 0 1px 0 var(--orange-dark);
      }

      .btn-text {
        flex: 1;
        min-width: 0; /* let long text shrink instead of pushing the icon out */
        text-align: center;
        line-height: 1.05;
      }
      /* LANDSCAPE */
      @media screen and (orientation: landscape) {
        body {
          background-image: url("../bg_land5.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
        }

        h1 {
          font-size: clamp(2rem, 7vw, 7rem);
          padding: 0.1em 0.5em;
          margin-top: 5vh;
          margin-bottom: -8vh;
        }

        .grid-wrapper {
          padding: 1vh 2vw 2vh;
          margin-top: 2vh;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          grid-template-rows: 1fr;
          gap: clamp(6px, 1.4vw, 16px);
          width: min(96vw, 1300px);
        }

        .btn {
          font-size: clamp(1rem, 4vw, 3rem);
          height: clamp(80px, 40vh, 220px);
        }
      }

      /* LANDSCAPE IPHONE */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        body {
          background-image: url("../bg_land5.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
          width: 100vw !important;
          min-width: 100vw !important;
          overflow-x: hidden !important;
        }

        h1 {
          font-size: clamp(1rem, 7vw, 4rem) !important;
          padding: 0.1em 0.5em !important;
          margin-top: -3vh !important;
          margin-bottom: -8vh !important;
        }

        .grid-wrapper {
          padding: 1vh 4vw 2vh;
          margin-top: 1vh;
        }

        .btn {
          height: clamp(55px, 34vh, 130px) !important;
          font-size: clamp(1rem, 6vw, 3.4rem) !important;
        }
      }

      /* PORTRAIT */
      @media screen and (orientation: portrait) {
        body {
          overflow-y: auto;
          background-image: url("../bg_port.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
        }

        h1 {
          font-size: clamp(1.5rem, 12vw, 4rem);
          padding: 0.3em 0.5em;
          margin-top: max(20px, env(safe-area-inset-top, 20px));
        }

        .grid-wrapper {
          padding: 2vw 9vw 6vw;
        }

        .grid {
          display: grid;
          grid-template-columns: 1fr;
          gap: clamp(8px, 5vw, 50px);
          width: 100%;
          max-width: 520px;
        }

        .btn {
          font-size: clamp(1.1rem, 9vw, 3.6rem);
          height: clamp(80px, 30vw, 250px);
        }
      }

      /* PORTRAIT IPHONE */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        body {
          background-image: url("../bg_port.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
        }

        h1 {
          font-size: clamp(1.1rem, 10.5vw, 3.9rem) !important;
          padding: 0.3em 0.5em !important;
          -webkit-text-stroke: 1.5px #f4930b;
          line-height: 1;
          margin-top: max(40px, env(safe-area-inset-top, 30px)) !important;
        }

        .grid-wrapper {
          padding: 3.5vh 9vw 2vw !important;
        }

        .grid {
          gap: 23px !important;
          width: 100% !important;
          margin-top: -5vh !important;
        }

        .btn {
          height: clamp(80px, 30vw, 180px) !important;
          font-size: clamp(1rem, 10vw, 3.1rem) !important;
        }
      }
    </style>
  </head>

  <body>
    <a class="back-btn" href="index.html">←</a>

    <h1>Unit 4</h1>

    <div class="grid-wrapper">
      <div class="grid" id="main-grid">
        <a class="btn" href="drop4.html">
          <span class="btn-text">Word Drop</span>
          <img class="btn-icon" src="../wd.png" alt="" />
        </a>
        <a class="btn" href="right4.html">
          <span class="btn-text">Right or Wrong</span>
          <img class="btn-icon" src="../tf.png" alt="" />
        </a>
        <a class="btn" href="build4.html">
          <span class="btn-text">Sentence Builder</span>
          <img class="btn-icon" src="../sb.png" alt="" />
        </a>
      </div>
    </div>
  </body>
</html>
