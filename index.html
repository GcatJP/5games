<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Adventure Island" />
    <meta name="theme-color" content="#ffcc00" />

    <!-- App icon -->
    <link rel="apple-touch-icon" href="home5.png" />

    <link rel="manifest" href="manifest.json" />

    <title>Adventure Island 5</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --orange-dark: #c45a1a;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        background-color: #880e4f;
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        transition: background 0.3s ease;
      }

      h1 {
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        color: #fae207;
        -webkit-text-stroke: 0.8px #f4930b;
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        white-space: nowrap;
      }

      .grid-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        position: relative;
        min-height: 0;
      }

      .btn {
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        font-weight: bold;
        color: #e8a020;
        background: #8b0b4c;
        border: 3px solid #e8a020;

        border-radius: 10px;
        text-decoration: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 0.4em;
        padding: 0 0.6em;
        width: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-stroke: 2px darkorange;
        transition:
          transform 0.1s ease,
          background 0.15s ease;
      }
      .btn:active {
        transform: scale(0.97);
        box-shadow: 0 1px 0 var(--orange-dark);
      }

      .btn-text {
        flex: 1;
        text-align: center;
        line-height: 1.05;
      }

      .btn-icon {
        height: 78%;
        width: auto;
        aspect-ratio: 1 / 1;
        flex-shrink: 0;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
      }

      /* LANDSCAPE */
      @media screen and (orientation: landscape) {
        body {
          background-image: url("bg_land5.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
          overflow: hidden;
        }

        h1 {
          font-size: clamp(2rem, 7vw, 7rem);
          padding: 0.1em 0.5em;
          margin-top: 5vh;
          margin-bottom: -8vh;
        }

        .grid-wrapper {
          padding: 1vh 2vw 2vh;
          margin-top: 2vh;
        }

        .grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr); /* old */
          grid-template-columns: repeat(3, 1fr); /* new */
          grid-template-rows: 1fr;
          gap: clamp(10px, 3vw, 30px);
          width: min(90vw, 1000px);
        }

        .btn {
          font-size: clamp(1rem, 5vw, 3.6rem);
          height: clamp(90px, 45vh, 240px);
          flex-direction: column;
          justify-content: center;
          gap: 0.2em;
          padding: 0.4em 0.6em;
        }
      }

      /* LANDSCAPE IPHONE */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        body {
          background-image: url("bg_land5.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
          width: 100vw !important;
          min-width: 100vw !important;
          overflow-x: hidden !important;
        }

        h1 {
          font-size: clamp(1rem, 7vw, 4rem) !important;
          padding: 0.1em 0.5em !important;
          margin-top: -3vh !important;
          margin-bottom: -8vh !important;
        }

        .grid-wrapper {
          padding: 1vh 6vw 2vh;
          margin-top: 1vh;
        }
        .grid {
          gap: clamp(10px, 3vw, 24px) !important;
        }
        .btn {
          height: clamp(55px, 34vh, 140px) !important;
          font-size: clamp(0.85rem, 4.5vw, 2.6rem) !important;
        }
      }

      /* PORTRAIT */
      @media screen and (orientation: portrait) {
        body {
          overflow-y: auto;
          background-image: url("bg_port5.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
        }

        h1 {
          font-size: clamp(1.5rem, 12vw, 4rem);
          padding: 0.3em 0.5em;
        }

        .grid-wrapper {
          padding: 2vw 9vw 6vw;
        }

        .grid {
          display: grid;
          grid-template-columns: 1fr;
          gap: clamp(12px, 6vw, 60px);
          width: 100%;
          max-width: 520px;
        }

        .btn {
          font-size: clamp(1.2rem, 10vw, 4rem);
          height: clamp(90px, 26vw, 240px);
        }
      }

      /* PORTRAIT IPHONE */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        h1 {
          font-size: clamp(1.1rem, 10.5vw, 3.9rem) !important;
          padding: 0.3em 0.5em !important;
          line-height: 1;
          margin-top: max(40px, env(safe-area-inset-top, 30px)) !important;
        }

        .grid-wrapper {
          padding: 3.5vh 9vw 2vw !important;
        }

        .grid {
          gap: 28px !important;
          width: 100% !important;
          margin-top: -5vh !important;
        }

        .btn {
          height: clamp(90px, 34vw, 200px) !important;
          font-size: clamp(1.1rem, 11vw, 3.4rem) !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="title-wrap">
      <h1>Adventure Island</h1>
    </div>

    <div class="grid-wrapper">
      <div class="grid" id="main-grid">
        <a class="btn" href="study/index.html">
          <span class="btn-text">Study</span>
          <img class="btn-icon" src="k1.png" alt="" />
        </a>
        <a class="btn" href="listening.html">
          <span class="btn-text">Audio</span>
          <img class="btn-icon" src="p1.png" alt="" />
        </a>
        <a class="btn" href="games/index.html">
          <span class="btn-text">Games</span>
          <img class="btn-icon" src="s1.png" alt="" />
        </a>
      </div>
    </div>
  </body>
</html>
