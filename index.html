<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Adventure Island" />
    <meta name="theme-color" content="#ffcc00" />

    <!-- App icon -->
    <link rel="apple-touch-icon" href="home5.png" />

    <link rel="manifest" href="manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com/" />
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap"
      rel="stylesheet"
    />
    <title>Adventure Island 5</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --ocean-deep: #0e6e6e;
        --ocean: #1e97a0;
        --ocean-light: #54c7c9;
        --coral: #ff7b54;
        --sun: #ffd23f;
        --white: #fffdf8;
        --orange-dark: #c45a1a;
        --orange-btn: #d4631e;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family:
          "Comic Neue", "Chalkboard SE", "Comic Sans MS", "Segoe Print",
          sans-serif;

        background-color: #880e4f;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        position: relative;
      }

      /* title (Island 0 theme) */
      .title-wrap {
        position: relative;
        display: inline-block;
        z-index: 1;
      }

      h1 {
        font-family:
          "Comic Neue", "Chalkboard SE", "Comic Sans MS", "Segoe Print",
          sans-serif;
        color: #fae207;
        -webkit-text-stroke: 0.8px #f4930b;
        width: 100%;
        text-align: center;
        letter-spacing: 0.03em;
        flex-shrink: 0;
        white-space: nowrap;
      }

      .grid-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        position: relative;
        z-index: 1;
      }

      /* single-button grid */
      .grid {
        display: flex;
        width: 100%;
      }

      /* unit-btn styling from Island 0 */
      .btn {
        font-family:
          "Comic Neue", "Chalkboard SE", "Comic Sans MS", "Segoe Print",
          sans-serif;
        font-weight: bold;
        color: #e8a020;
        background: #8b0b4c;
        border: 3px solid #e8a020;
        border-radius: clamp(10px, 2vw, 18px);
        text-decoration: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.3em;
        padding: 0 0.4em;
        width: 100%;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-stroke: 0.5px rgba(0, 0, 0, 0.2);
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease;
      }

      .btn:active {
        transform: translateY(3px) scale(0.98);
        box-shadow: 0 1px 0 var(--orange-dark);
      }

      .btn-text {
        text-align: center;
        line-height: 1.05;
        flex-shrink: 0;
      }

      .btn-icon {
        height: 78%;
        width: auto;
        aspect-ratio: 1 / 1;
        flex-shrink: 1;
        min-width: 0;
        object-fit: contain;
        pointer-events: none;
        user-select: none;
      }

      /* LANDSCAPE */
      @media screen and (orientation: landscape) {
        body {
          background-image: url("bg_land5.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
        }

        h1 {
          font-size: clamp(2rem, 7vw, 7rem);
          padding: 0.1em 0.5em;
          margin-top: 5vh;
          margin-bottom: -8vh;
        }

        .grid-wrapper {
          padding: 1vh 2vw 2vh;
          margin-top: 2vh;
        }

        .grid {
          justify-content: center;
          width: 100%;
        }

        .btn {
          font-size: clamp(1.2rem, 7vw, 4.6rem);
          height: clamp(80px, 45vh, 220px);
          width: min(96vw, 640px);
        }
      }

      /* LANDSCAPE IPHONE */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        body {
          background-image: url("bg_land5.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
          width: 100vw !important;
          min-width: 100vw !important;
          overflow-x: hidden !important;
        }

        h1 {
          font-size: clamp(1rem, 7vw, 4rem) !important;
          padding: 0.1em 0.5em !important;
          margin-top: -3vh !important;
          margin-bottom: -8vh !important;
        }

        .grid-wrapper {
          padding: 1vh 4vw 2vh;
          margin-top: 1vh;
        }

        .btn {
          height: clamp(55px, 34vh, 130px) !important;
          font-size: clamp(1rem, 6vw, 3.4rem) !important;
        }
      }

      /* PORTRAIT */
      @media screen and (orientation: portrait) {
        body {
          overflow-y: auto;
          background-image: url("bg_port5.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
        }

        h1 {
          font-size: clamp(1.5rem, 12vw, 4rem);
          padding: 0.3em 0.5em;
          margin-top: max(20px, env(safe-area-inset-top, 20px));
        }
        .grid-wrapper {
          padding: 2vw 9vw 10vw;
        }

        .grid {
          width: 100%;
          max-width: 520px;
        }

        .btn {
          font-size: clamp(1.2rem, 11vw, 4.6rem);
          height: clamp(90px, 36vw, 340px);
        }
        @media screen and (orientation: portrait) {
          .btn-icon {
            height: min(95%, 20vw);
          }
        }
      }

      /* PORTRAIT IPHONE */
      @media screen and (orientation: portrait) and (max-width: 430px) {
        body {
          background-image: url("bg_port5.png");
          background-size: cover;
          background-position: center center;
          background-repeat: no-repeat;
        }

        h1 {
          font-size: clamp(1rem, 9vw, 3.8rem) !important;
          padding: 0.3em 0.5em !important;
          -webkit-text-stroke: 1.5px #f4930b;
          line-height: 1;
          margin-top: max(80px, env(safe-area-inset-top, 60px)) !important;
        }
        .btn-icon {
          height: 100%;
          width: auto;
          aspect-ratio: 1 / 1;
          flex-shrink: 1;
          min-width: 0;
          object-fit: contain;
          pointer-events: none;
          user-select: none;
        }
        .grid-wrapper {
          padding: 4vh 9vw 2vw !important;
        }

        .grid {
          width: 100% !important;
          margin-top: -10vh !important;
        }

        .btn {
          height: clamp(90px, 40vw, 250px) !important;
          font-size: clamp(1.1rem, 11vw, 3.4rem) !important;
        }
        @media screen and (orientation: portrait) {
          .btn-icon {
            height: 100%;
            width: auto;
            aspect-ratio: 1 / 1;
            flex-shrink: 1;
            min-width: 0;
            object-fit: contain;
            pointer-events: none;
            user-select: none;
          }
          .btn {
            height: clamp(90px, 48vw, 250px) !important;
            font-size: clamp(1.1rem, 11vw, 3.4rem) !important;
          }
        }
      }
    </style>
  </head>

  <body>
    <div class="sun"></div>
    <div class="cloud cloud1"></div>

    <div class="title-wrap">
      <h1>Adventure Island</h1>
    </div>

    <div class="grid-wrapper">
      <div class="grid" id="main-grid">
        <a class="btn" href="units/index.html">
          <img class="btn-icon" src="k1.png" alt="" />
          <span class="btn-text">Games</span>
          <img class="btn-icon" src="s1.png" alt="" />
        </a>
      </div>
    </div>
  </body>
</html>
